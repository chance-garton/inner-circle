<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0F1C">
<title>Inner Circle | InnerVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&text=%E2%99%88%E2%99%89%E2%99%8A%E2%99%8B%E2%99%8C%E2%99%8D%E2%99%8E%E2%99%8F%E2%99%90%E2%99%91%E2%99%92%E2%99%93&display=swap">
<style>
:root{
  --ground:#0A0F1C; --surface:#111827; --card:#151E33; --line:rgba(233,238,246,0.12);
  --ink:#E9EEF6; --muted:#9AA6BA; --lapis:#3B74CC; --lapis-lit:#8FB5F0;
  --gold:#D8AA3C; --on-gold:#0A0F1C; --danger:#F2998A;
  --brand:'Fjalla One','Arial Narrow',Impact,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
/* feel like an app on phones: nothing gets highlighted or called out by a stray press, except where you type */
@media (hover:none){html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  input,textarea,[contenteditable="true"],emoji-picker{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}}
/* iPhone only plays a haptic tick for a real tap on a switch, so tappable controls carry an invisible one */
input[data-hx]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;border-radius:inherit;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;cursor:inherit}
html.nohx input[data-hx]{display:none}
/* animated emoji (Noto Emoji animations) over the plain emoji, which stays as the fallback */
.ae{position:relative;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.ae .anim{position:absolute;inset:-14%;pointer-events:none}
.ae .anim svg{display:block}
.ae.animated .t{visibility:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
p{margin:0} h1,h2,h3{margin:0;font-weight:600}
ul,ol{list-style:none;margin:0;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--lapis-lit);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* nav */
.nav{height:76px;background:rgba(10,15,28,0.92);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1200px)/2));gap:24px;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.nav.member{border-top:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;object-fit:contain}
.nav.member .brand img{filter:drop-shadow(0 0 10px rgba(216,170,60,0.5))}
.nav.visitor .brand img{filter:drop-shadow(0 0 10px rgba(59,116,204,0.55))}
.word{font-family:var(--brand);font-weight:700;font-size:23px;letter-spacing:5px;text-transform:uppercase;line-height:1}
.links{flex:1;display:flex;justify-content:center;gap:26px}
.link{font-family:var(--brand);font-size:16px;letter-spacing:2px;text-transform:uppercase;padding:9px 0 6px;border-bottom:3px solid transparent;line-height:1}
.link.on{border-bottom-color:var(--lapis)} .nav.member .link.on{border-bottom-color:var(--gold)}
.acts{display:flex;align-items:center;gap:18px}
.loginlink{font-family:var(--brand);font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.join{height:34px;padding:0 16px;border-radius:10px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center}
@media (max-width:1000px){.links{display:none}.nav{justify-content:space-between}}

/* type and buttons */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);line-height:1.2}
.label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);line-height:1.2}
.h1{font-family:var(--display);font-weight:600;letter-spacing:-1px;line-height:1.05}
.hook{font-family:var(--display);font-style:italic;font-weight:400;color:var(--gold);line-height:1.2}
.btn1{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 24px;border-radius:10px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:15px;white-space:nowrap}
.btn1[disabled]{opacity:.5;cursor:default}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 22px;border-radius:10px;border:2px solid rgba(216,170,60,0.75);color:var(--ink);font-weight:700;font-size:15px;white-space:nowrap}
.btn2.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:9px;gap:7px}
.btn2:hover,.btn1:hover{transform:translateY(-1px)}
.ibtn{width:42px;height:42px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ibtn:hover{background:rgba(233,238,246,0.06)}
.small{font-size:13px;line-height:1.55;color:var(--muted)}

/* avatars */
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--brand);color:#0A0F1C;flex:none;overflow:hidden;line-height:1;background:#8FB5F0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ring{box-shadow:0 0 0 2px var(--ground),0 0 0 3.5px rgba(216,170,60,0.85)}

/* door */
.door{max-width:1200px;margin:0 auto;padding:64px 20px 64px;display:flex;gap:80px;align-items:flex-start}
.door .copy{flex:1 1 520px;min-width:0}
.door .glimpse{flex:0 1 560px}
.point{display:flex;gap:14px;align-items:flex-start}
.picon{width:40px;height:40px;border-radius:12px;border:1px solid rgba(216,170,60,0.45);background:rgba(216,170,60,0.08);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.pt1{font-weight:700;font-size:15.5px;line-height:1.35}
.pt2{font-size:14.5px;line-height:1.55;color:var(--muted);margin-top:2px}
.soonchip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(216,170,60,0.5);border-radius:999px;padding:3px 8px 2px;line-height:1.2;vertical-align:2px;margin-left:6px}
.glimpse{position:relative;border-radius:18px;border:1px solid rgba(216,170,60,0.4);background:var(--surface);box-shadow:0 0 40px rgba(216,170,60,0.32);overflow:hidden;height:560px;display:flex;flex-direction:column}
.ghost{background:rgba(233,238,246,0.09);border-radius:14px 14px 14px 5px;padding:14px;display:flex;flex-direction:column;gap:9px}
.ghost.me{background:rgba(59,116,204,0.26);border-radius:14px 14px 5px 14px}
.gline{height:9px;border-radius:5px;background:rgba(233,238,246,0.16)}
.lockmed{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 28px;border-radius:18px;background:rgba(10,15,28,0.86);border:1px solid rgba(216,170,60,0.5);text-align:center}
.lockring{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px rgba(216,170,60,0.55)}
.note{margin-top:18px;padding:12px 14px;border-radius:12px;border:1px solid rgba(242,153,138,0.5);background:rgba(242,153,138,0.08);font-size:14px;line-height:1.5}
@media (max-width:900px){.door{flex-direction:column;gap:32px;padding-top:34px}.door .glimpse{width:100%;height:340px;flex:none}.door .h1{font-size:44px!important}}

/* onboarding */
.onb{max-width:460px;margin:0 auto;padding:28px 22px 32px;min-height:calc(100dvh - 76px);display:flex;flex-direction:column}
.steps{display:flex;gap:6px}.steps span{width:22px;height:5px;border-radius:3px;background:rgba(233,238,246,0.2)}.steps span.on{background:var(--gold)}
.rnum{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(216,170,60,0.7);color:var(--gold);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.flabel{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.finput{display:block;width:100%;height:50px;border-radius:12px;background:var(--card);border:1px solid rgba(233,238,246,0.2);padding:0 15px;font-size:16px;outline:none}
.ftext{display:block;width:100%;height:64px;border-radius:12px;background:var(--card);border:1px solid rgba(233,238,246,0.2);padding:12px 15px;font-size:15px;line-height:1.45;outline:none;resize:none}
.finput::placeholder,.ftext::placeholder{color:#8794AA}
.fhelp{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(233,238,246,0.2);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{border-color:rgba(216,170,60,0.85);background:rgba(216,170,60,0.14)}
.sym{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0A0F1C;flex:none}
.sym.on{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--gold)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.suggest{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.suggest button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;font-size:13.5px;font-weight:600;line-height:1.35;border-top:1px solid var(--line)}
.suggest button:first-child{border-top:0}
.suggest img,.favrow img{width:64px;height:36px;border-radius:6px;object-fit:cover;flex:none}
.favrow{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;font-weight:600;line-height:1.35}

/* chat shell */
.shell{max-width:1200px;margin:0 auto;padding:20px 20px;display:flex;gap:28px;height:calc(100dvh - 76px)}
.side{width:280px;flex:none;display:flex;flex-direction:column;gap:24px;overflow:auto;padding-top:4px}
.roomrow{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:10px;font-weight:600;font-size:15px}
.roomrow.on{background:rgba(216,170,60,0.13)} .roomrow.on svg{color:var(--gold)}
.roomrow.soon{color:var(--muted);font-weight:500}
.roomrow .soonchip{margin-left:auto}
.person{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 6px;border-radius:10px;font-size:14.5px;font-weight:600;width:100%}
.person:hover{background:rgba(233,238,246,0.05)}
.person .role{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.mecard{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:auto}
.panel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line);flex:none}
.room{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-0.4px;line-height:1.1}
.sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:3px;line-height:1.2}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lapis-lit);flex:none}
.dot.off{background:#5B6577}
.pinbar{display:flex;align-items:center;gap:12px;padding:9px 20px;background:rgba(216,170,60,0.07);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);flex:none;line-height:1.3;width:100%}
.pinbar .pk{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;flex:none}
.pinbar .pt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:26px 20px 8px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.day{align-self:center;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px;margin:10px 0 8px;line-height:1}
.row{display:flex;align-items:flex-end;gap:10px;margin-top:2px}
.row.first{margin-top:10px}
.row{position:relative}
.row:hover,.row:focus-within{z-index:4}
.row .gap{width:36px;flex:none}
.stack{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:min(680px,82%)}
.bub{position:relative;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 6px;padding:8px 13px 9px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.row.me .bub{background:rgba(59,116,204,0.20);border-color:rgba(143,181,240,0.30)}
.row.flash .bub{border-color:var(--gold)}
.bub .txt{white-space:pre-wrap}
.bub a.lnk{color:var(--lapis-lit);font-weight:600}
.signs{display:inline-flex;align-items:center;gap:9px;color:var(--gold);font-weight:600;font-size:13px}
.signs span{display:inline-flex;align-items:center;gap:3px}
.zg{font-family:'Noto Sans Symbols','Segoe UI Symbol','Apple Symbols',sans-serif;font-variant-emoji:text;font-size:15px;line-height:1}
.who{display:flex;align-items:center;gap:6px 8px;font-weight:700;font-size:13.5px;margin-bottom:2px;line-height:1.3;flex-wrap:wrap}
.who.host{color:var(--gold)}
.time{font-size:11.5px;color:var(--muted);font-weight:500}
.metime{display:block;text-align:right;font-size:11.5px;color:rgba(233,238,246,0.6);margin-top:2px}
.badge{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:3px 7px 2px;border-radius:999px;line-height:1.2}
.badge.host{background:var(--gold);color:var(--on-gold)}
.badge.mod{border:1px solid rgba(143,181,240,0.6);color:var(--lapis-lit)}
.badge.init{border:1px solid rgba(216,170,60,0.6);color:var(--gold)}
.badge.title{background:rgba(165,150,245,0.18);border:1px solid rgba(165,150,245,0.7);color:#C9BEFF}
.deleted{font-style:italic;color:var(--muted)}
.tchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border:1.5px solid rgba(143,181,240,0.6);border-radius:999px;color:var(--lapis-lit);font-weight:700;font-size:12.5px;vertical-align:middle;line-height:1;white-space:nowrap}
.reacts{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 8px;border-radius:999px;background:rgba(233,238,246,0.06);border:1px solid var(--line);font-size:12.5px;font-weight:700;line-height:1}
.react.mine{border-color:rgba(216,170,60,0.75);background:rgba(216,170,60,0.13)}
.react .em{font-size:15px;line-height:1}
.react{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.rxstack{position:fixed;width:min(290px,calc(100vw - 24px));display:flex;flex-direction:column;align-items:flex-start;gap:8px;animation:rxin .16s ease-out}
@keyframes rxin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.rxbig{height:92px;display:flex;align-items:flex-end;padding-left:4px}
.ae.lg{width:88px;height:88px;font-size:68px}
.ae.sm{width:22px;height:22px;font-size:18px}
.rxpills{display:flex;gap:6px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.rxpills button,.rxone{flex:none;height:36px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid rgba(233,238,246,0.16);font-size:13.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 22px rgba(0,0,0,0.4)}
.rxpills button.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.rxmini{display:inline-flex;margin-left:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--card)}
.rxmini:first-of-type{margin-left:0}
.rxcard{width:100%;background:var(--card);border:1px solid rgba(233,238,246,0.14);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,0.55);max-height:min(320px,50vh);overflow:auto;padding:6px}
.rxrow{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 10px;border-radius:12px;color:var(--ink);font-size:15px;font-weight:600;text-align:left}
.rxrow:active{background:rgba(233,238,246,0.07)}
.rxname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rxname .muted{font-weight:500}
.rxem{font-size:20px}
.rcount{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 8px;border-radius:999px;color:var(--lapis-lit);font-size:12.5px;font-weight:700;line-height:1}
.rcount:hover{background:rgba(143,181,240,0.1)}
.ctx{position:fixed;z-index:25;width:352px;max-height:calc(100dvh - 24px);overflow:auto;background:var(--card);border:1px solid rgba(233,238,246,0.16);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,0.5)}
.ctx .mi{min-height:42px;font-size:14.5px}
emoji-picker{--background:var(--card);--border-color:rgba(233,238,246,0.12);--indicator-color:var(--gold);--input-border-color:rgba(233,238,246,0.2);--input-font-color:var(--ink);--input-placeholder-color:#8794AA;--outline-color:var(--lapis-lit);--category-font-color:var(--muted);--button-active-background:rgba(216,170,60,0.2);--button-hover-background:rgba(233,238,246,0.08);width:100%;height:360px;display:block}
.thread-list{padding:6px 16px 16px;display:flex;flex-direction:column;gap:3px}
.row.focus .bub{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,170,60,0.4)}
.quote{display:block;width:100%;min-width:140px;max-width:100%;box-sizing:border-box;background:rgba(10,15,28,0.55);border-radius:8px;border-left:3px solid var(--lapis-lit);padding:5px 10px 6px;margin:3px 0 7px;font-size:13.5px;color:var(--muted);line-height:1.4;overflow:hidden;text-align:left}
.quote b{display:block;color:var(--lapis-lit);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote .qt{display:block;width:0;min-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unfurl{display:flex;gap:12px;background:rgba(10,15,28,0.55);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;align-items:flex-start;max-width:440px}
.unfurl img{width:136px;height:76px;border-radius:8px;object-fit:cover;flex:none}
.unfurl .ut{font-weight:600;font-size:14px;line-height:1.38;margin:5px 0 0}
.unfurl .ue{font-size:10.5px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);line-height:1.2}
.unfurl .ue.free{color:var(--lapis-lit)}
.mimg{display:block;margin-top:6px;max-width:100%;max-height:360px;border-radius:10px;cursor:zoom-in;background:rgba(233,238,246,0.06);min-width:120px;min-height:80px}
.joined{align-self:center;display:flex;align-items:center;gap:7px;margin:10px 0;padding:5px 14px 5px 6px;border-radius:999px;background:rgba(216,170,60,0.09);border:1px solid rgba(216,170,60,0.3);font-size:13.5px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.joined button{display:inline-flex;align-items:center;gap:7px;color:var(--gold)}
.joined .time{margin-left:4px}
.pscrim{display:block;padding:0;background:rgba(5,8,15,0.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.scrim,.scrim *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.scrim input,.scrim textarea,.scrim emoji-picker{-webkit-user-select:text;user-select:text}

// ------------------------------------------------------------ socket
function connect() {
  if (!S.token) { S.view = 'door'; render(); return; }
  const ws = new WebSocket(API.replace(/^http/, 'ws') + '/ws');
  S.ws = ws;
  ws.onopen = () => { ws.send(JSON.stringify({ t: 'hello', token: S.token })); };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onEvent(m); };
  ws.onclose = ev => {
    S.connected = false;
    if (S.denied) return;
    if (S.view === 'chat') renderConn();
    const wait = Math.min(1000 * Math.pow(2, S.retry++), 15000);
    setTimeout(connect, wait);
  };
}
function sendWs(obj) { if (S.ws && S.ws.readyState === 1) { S.ws.send(JSON.stringify(obj)); return true; } toast('Reconnecting. Try again in a moment.'); return false; }

function mergePeople(p) { if (p) Object.assign(S.people, p); }
function onEvent(m) {
  switch (m.t) {
    case 'denied':
      S.denied = m.why;
      if (m.why === 'signed-out') store('ivc_token', null), S.token = null;
      S.view = 'door'; render(); return;
    case 'init':
      S.connected = true; S.retry = 0;
      setTimeout(() => { sendWs({ t: 'notify', level: notifyLevel() }); sendWs({ t: 'away', on: away() }); }, 0);
      S.me = m.me; S.people[m.me.uid] = m.me; mergePeople(m.people); setQuick();
      S.messages = m.messages; S.pins = m.pins; S.online = m.online; S.signs = m.signs; if (Array.isArray(m.reactions) && m.reactions.length) DEFAULT_QUICK = m.reactions; setQuick();
      S.oldestDone = m.messages.length < 50;
      S.view = !m.me.rules_ok ? 'rules' : (!m.me.profile_done ? 'profile' : 'chat');
      if (S.view === 'chat' && S.editing) S.view = 'profile';
      render();
      if (S.view === 'chat' && S.openLink) { sendWs({ t: 'thread', id: S.openLink }); S.openLink = null; }
      return;
    case 'me':
      if (m.me && m.me.recent) { S.me = Object.assign(S.me || {}, { recent: m.me.recent }); setQuick(); }
      S.me = m.me; S.people[m.me.uid] = Object.assign({}, S.people[m.me.uid], m.me);
      if (S.view === 'rules' && m.me.rules_ok) { S.view = m.me.profile_done ? 'chat' : 'profile'; render(); }
      else if (S.view === 'profile' && m.me.profile_done) { S.editing = false; S.view = 'chat'; render(); }
      return;
    case 'person':
      S.people[m.p.uid] = Object.assign({}, S.people[m.p.uid], m.p);
      if (S.me && m.p.uid === S.me.uid) Object.assign(S.me, m.p);
      if (S.view === 'chat') { renderMessages(true); renderSide(); }
      return;
    case 'presence': S.online = m.online; if (S.view === 'chat') { renderSide(); renderHeadCounts(); } return;
    case 'msg': {
      mergePeople(m.people);
      if (S.messages.some(x => x.id === m.m.id)) return;
      S.messages.push(m.m);
      delete S.typing[m.m.uid];
      if (S.view === 'chat') {
        const box = $('#msgs'); const atBottom = !box || box.scrollHeight - box.scrollTop - box.clientHeight < 140;
        renderMessages(atBottom || m.m.uid === S.me.uid);
        if (!atBottom && m.m.uid !== S.me.uid) $('#jump') && $('#jump').classList.add('show');
        renderTyping();
      }
      onIncoming(m.m);
      return;
    }
    case 'update': {
      const i = S.messages.findIndex(x => x.id === m.m.id);

      if (m.m.deleted) {

        if (hit && S.view === 'chat') renderMessages(false);

      }
      const ti = (S.threadMsgs || []).findIndex(x => x.id === m.m.id);
      if (ti >= 0 && m.m.deleted) S.threadMsgs.splice(ti, 1);
      if (ti >= 0 && $('#thread')) { S.threadMsgs[ti] = m.m; sendWs({ t: 'thread', id: S.threadId }); }

      const have = new Set(S.messages.map(x => x.id));
      S.messages = m.messages.filter(x => !have.has(x.id) && !x.deleted).concat(S.messages);
      S.oldestDone = m.done; S.loadingOlder = false;
      renderMessages(false);
      if (box) box.scrollTop = box.scrollHeight - before;
      return;
    }
    case 'typing': S.typing[m.uid] = Date.now(); renderTyping(); setTimeout(renderTyping, 4200); return;
    case 'thread': mergePeople(m.people); showThread(m); return;
    case 'results': mergePeople(m.people); showResults(m); return;
    case 'who': S.people[m.p.uid] = Object.assign({}, S.people[m.p.uid], m.p); openProfile(m.p.uid, true); return;
    case 'members': mergePeople(m.people); S.online = m.online; if (!m.quiet) openPeople(true); return;
    case 'mentionlist': mergePeople(m.people); showMentions(m); return;
    case 'reports': S.reports = m.count; renderSide(); return;
    case 'reportlist': mergePeople(m.people); showReports(m); return;
    case 'modlog': mergePeople(m.people); showModlog(m); return;
    case 'restore': {
      mergePeople(m.people);

        S.messages.push(m.m); S.messages.sort((a, b) => a.id - b.id);
        if (S.view === 'chat') renderMessages(false);
      }
      return;
    }
    case 'notice': toast(m.text); return;
    case 'error': toast(m.text); return;
  }
}

function avatarDraft(a, size) {
  const fake = { uid: S.me ? S.me.uid : 'x', name: (S.draft && S.draft.name) || (S.me && S.me.name) || '?', avatar: a };
  const keep = S.people[fake.uid]; S.people[fake.uid] = Object.assign({}, keep, fake);
  const html = avatar(fake.uid, size, true); S.people[fake.uid] = keep; return html;
}

function wireComposer() {

      <button class="mi danger" data-a="remove">${I.remove()}Remove from the Circle</button>` : ''}
    </div>`;
  const o = at ? overlay(reactHtml + menuHtml, true, 'Message actions', at) : phoneMenu(id, reactHtml, menuHtml);
  animateIn(o);
  const react = k => { sendWs({ t: 'react', id, kind: k }); closeOverlay(); };
  o.querySelectorAll('[data-k]').forEach(b => b.onclick = () => react(b.dataset.k));
  o.querySelector('[data-allemoji]').onclick = () => {
    const menu = o.querySelector('#actmenu'); menu.innerHTML = '';
    o.querySelector('.reactbar').remove();
    menu.appendChild(emojiPicker(react));
    if (o.classList.contains('pscrim')) { menu.classList.add('picking'); menu.parentElement.style.marginLeft = '0'; menu.parentElement.style.width = '100%'; placePhoneMenu(o); }
    if (at) { const box = o.firstElementChild; box.style.width = '360px'; const r = box.getBoundingClientRect(); box.style.left = Math.max(8, Math.min(r.left, innerWidth - 368)) + 'px'; box.style.top = Math.max(8, Math.min(r.top, innerHeight - 380)) + 'px'; }
  };
  o.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a; closeOverlay();
    if (a === 'reply') startReply(id);
    if (a === 'edit') startEdit(id);
    if (a === 'copy') navigator.clipboard && navigator.clipboard.writeText(m.text).then(() => toast('Copied.'));
    if (a === 'thread') sendWs({ t: 'thread', id });
    if (a === 'link') navigator.clipboard && navigator.clipboard.writeText(location.origin + '/#m=' + id).then(() => toast('Link copied. Only members can open it.'));
    if (a === 'profile') askProfile(m.uid);
    if (a === 'report') { const reason = prompt('What is wrong with this message? (optional)'); if (reason !== null) sendWs({ t: 'report', id, reason }); }
    if (a === 'delete' && confirm('Delete this message for everyone?')) sendWs({ t: 'delete', id });
    if (a === 'pin') sendWs({ t: 'pin', id, on: !m.pinned });
    if (a === 'mute') sendWs({ t: 'mute', uid: m.uid, hours: p.muted ? 0 : 24 });
    if (a === 'remove' && confirm(`Remove ${p.name} from the Inner Circle? They will lose access to the chat.`)) sendWs({ t: 'remove', uid: m.uid });
  });
}

function openSearch(scope) {
  S.searchScope = scope || 'room';
  const o = overlay(`<div style="padding:16px 12px 10px 18px;display:flex;align-items:center;gap:10px"><h2 class="h1" style="font-size:22px;flex:1">Search</h2><button class="ibtn" id="sclose" aria-label="Close">${I.close()}</button></div>
    <div style="padding:0 16px 10px"><input id="sq" class="finput" type="search" placeholder="Search messages and names" autocomplete="off" style="height:46px;font-size:15px"></div>
    <div role="radiogroup" aria-label="Where to search" style="display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line)">
      <button class="chip" data-scope="room" role="radio">This chat</button><button class="chip" data-scope="all" role="radio">All chats</button></div>
    <div id="sres" style="padding:8px 8px 14px;min-height:120px"></div>`, false, 'Search');
  o.firstElementChild.style.width = 'min(560px, 100%)';
  const mark = () => o.querySelectorAll('[data-scope]').forEach(b => { const on = b.dataset.scope === S.searchScope; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  mark();
  let timer = null;
  const run = () => { const q = $('#sq').value.trim(); if (q.length < 2) { $('#sres').innerHTML = '<p class="muted" style="padding:12px 10px;font-size:14px">Type at least two letters.</p>'; return; } sendWs({ t: 'search', q, scope: S.searchScope }); };
  $('#sq').oninput = () => { clearTimeout(timer); timer = setTimeout(run, 280); };
  $('#sq').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(timer); run(); } };
  o.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { S.searchScope = b.dataset.scope; mark(); run(); });
  $('#sclose').onclick = closeOverlay;
  run(); $('#sq').focus();
}
function showResults(r) {
  const box = $('#sres'); const input = $('#sq');
  if (!box || !input || r.q !== input.value.trim()) return;
  if (!r.messages.length) { box.innerHTML = `<p class="muted" style="padding:12px 10px;font-size:14px">Nothing found for "${esc(r.q)}".</p>`; return; }
  const re = new RegExp('(' + r.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  const hl = t => esc(t).replace(re, '<mark style="background:rgba(216,170,60,0.35);color:inherit;border-radius:3px">$1</mark>');
  const snip = t => { const i = t.toLowerCase().indexOf(r.q.toLowerCase()); const a = Math.max(0, i - 50); return (a ? '…' : '') + t.slice(a, a + 180) + (t.length > a + 180 ? '…' : ''); };
  box.innerHTML = `<div class="muted" style="font-size:12.5px;padding:2px 10px 8px">${r.messages.length}${r.messages.length >= 60 ? '+' : ''} result${r.messages.length === 1 ? '' : 's'}${r.scope === 'all' ? ' across all chats' : ' in this chat'}</div>` + r.messages.map(m => { const p = person(m.uid);
    return `<button class="person" data-hit="${m.id}" style="align-items:flex-start;padding:9px 10px;min-height:0;gap:11px">${avatar(m.uid, 32)}<span style="flex:1;min-width:0;text-align:left"><span style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b style="font-size:14px">${hl(p.name || 'Member')}</b><span class="time">${r.scope === 'all' ? esc(r.room) + ' · ' : ''}${esc(dayLabel(m.created))} ${fmtTime(m.created)}</span></span><span style="display:block;font-weight:500;font-size:14px;line-height:1.45;margin-top:2px;color:var(--ink)">${m.text ? hl(snip(m.text)) : '<span class="muted">Image</span>'}</span></span></button>`; }).join('');
  hydrateMedia(box);
  box.querySelectorAll('[data-hit]').forEach(b => b.onclick = () => sendWs({ t: 'thread', id: Number(b.dataset.hit) }));
}

function showThread(t) {
  S.threadMsgs = t.messages; S.threadId = t.id;
  const o = overlay(`<div style="padding:16px 12px 8px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)"><h2 class="h1" style="font-size:22px;flex:1">Thread</h2><button class="ibtn" id="thclose" aria-label="Close">${I.close()}</button></div>
    <div id="thread" class="thread-list">${t.messages.map((m, i, l) => msgHtml(m, i, l)).join('')}</div>
    <div style="padding:0 16px 16px"><button class="btn2 sm" id="threply">${I.reply(16)}Reply in the chat</button></div>`, false, 'Thread');
  o.firstElementChild.style.width = 'min(640px, 100%)';
  const focus = o.querySelector(`#thread .row[data-id="${t.id}"]`);
  if (focus) { focus.classList.add('focus'); setTimeout(() => focus.scrollIntoView({ block: 'center' }), 30); }
  hydrateMedia(o); hydrateUnfurls(o);
  $('#thclose').onclick = closeOverlay;
  $('#threply').onclick = () => { closeOverlay(); startReply(t.id); };
}

function askProfile(uid) { sendWs({ t: 'who', uid }); }
function openProfile(uid) {
  const p = person(uid); const me = S.me;
  const mod = me.role === 'host' || me.role === 'mod';
  const self = uid === me.uid;
  const signs = [['Sun', p.sun, '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>'], ['Moon', p.moon, SYMS.moon], ['Rising', p.rising, '<path d="M3 19h18"/><path d="M6 19a6 6 0 0 1 12 0"/><path d="M12 4v6M9.5 6.5 12 4l2.5 2.5"/>']].filter(s => s[1]);
  const joined = p.joined ? new Date(p.joined).toLocaleDateString([], { month: 'long', year: 'numeric' }) : '';
  const o = overlay(`<div style="padding:22px 22px 20px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;gap:16px;align-items:center">${avatar(uid, 76, true)}<div style="flex:1;min-width:0"><h2 class="h1" style="font-size:28px;letter-spacing:-0.6px;overflow-wrap:anywhere">${esc(p.name)}</h2><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${badges(p)}</div>${joined ? `<div class="muted" style="font-size:13px;margin-top:7px">In the Circle since ${esc(joined)}</div>` : ''}</div><button class="ibtn" id="pclose" aria-label="Close" style="align-self:flex-start;color:var(--muted)">${I.close()}</button></div>
    ${p.bio ? `<p style="font-size:15px;line-height:1.6">${esc(p.bio)}</p>` : ''}
    ${signs.length ? `<div style="border-top:1px solid var(--line);padding-top:16px"><div class="label" style="margin-bottom:10px">Sun, Moon &amp; Rising</div><div style="display:flex;flex-wrap:wrap;gap:6px">${signs.map(s => `<span class="chip" style="gap:6px;padding:0 10px;font-size:12.5px">${P(s[2], {s:15}).replace('currentColor', '#D8AA3C').replace('fill="currentColor"', 'fill="#D8AA3C"')}${s[0]} <span class="zg" style="color:var(--gold)">${ZODIAC[s[1]] ? ZODIAC[s[1]] + '\uFE0E' : ''}</span> ${esc(s[1])}</span>`).join('')}</div></div>` : ''}
    ${p.interests && p.interests.length ? (p.interests = p.interests.slice(0, 5), '') + `<div><div class="label" style="margin-bottom:10px">Into</div><div style="display:flex;flex-wrap:wrap;gap:6px">${p.interests.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>` : ''}
    ${p.favorites && p.favorites.length ? `<div><div class="label" style="margin-bottom:10px">My favorite episodes</div><div id="pfavlist"></div></div>` : ''}
    ${self ? `<button class="btn2" id="pedit" style="min-height:46px;font-size:14px">${I.edit(16)}Edit your profile</button>` : `<button class="btn2" id="pmention" style="min-height:46px;font-size:14px">Mention ${esc(p.name)} in the chat</button>`}
    ${mod && !self && p.role !== 'host' ? `<div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px">
       ${me.role === 'host' ? `<button class="btn2 sm" data-pa="role">${p.role === 'mod' ? 'Remove moderator' : 'Make moderator'}</button>` : ''}
       ${p.role !== 'mod' || me.role === 'host' ? `<button class="btn2 sm" data-pa="mute">${p.muted ? 'Unmute' : 'Mute 24 hours'}</button><button class="btn2 sm" data-pa="remove" style="border-color:rgba(242,153,138,0.7);color:var(--danger)">Remove from the Circle</button>` : ''}
       </div>` : ''}
    ${me.role === 'host' ? `<div style="border-top:1px solid var(--line);padding-top:12px"><div class="label" style="margin-bottom:8px">Titles <span style="text-transform:none;letter-spacing:0;font-weight:500">(only you see this)</span></div>
       <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${(p.initiator ? ['Initiator'] : []).concat(p.titles || []).map(t => `<span class="chip" style="gap:6px;padding:0 6px 0 11px">${esc(t)}<button data-untitle="${esc(t)}" aria-label="Remove the ${esc(t)} title" style="width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%">${I.close(13)}</button></span>`).join('') || '<span class="muted" style="font-size:13px">No titles yet.</span>'}</div>
       <div style="display:flex;gap:8px"><input id="newtitle" class="finput" maxlength="32" placeholder="New title, like Special Guest" style="height:38px;font-size:14px"><button class="btn2 sm" id="addtitle">Add</button></div></div>` : ''}
    <div class="muted" style="display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px">${I.lock(13)}Only Inner Circle members can see this profile</div>
  </div>`, false, p.name + "'s profile");
  hydrateMedia(o);
  if (p.favorites && p.favorites.length) loadIndexes().then(ix => {
    const el = $('#pfavlist'); if (!el) return;
    el.innerHTML = p.favorites.map(s => { const e = ix.free[s] || {}; return `<a class="favrow" href="${esc(e.url || SITE + '/episodes/' + s)}" target="_blank" rel="noopener"><img src="${esc(e.thumb || '')}" alt=""><span>${esc(e.title || s)}</span></a>`; }).join('');
  });
  $('#pclose').onclick = closeOverlay;
  o.querySelectorAll('[data-untitle]').forEach(b => b.onclick = () => sendWs({ t: 'title', uid, remove: b.dataset.untitle }));
  if ($('#addtitle')) {
    const add = () => { const v = $('#newtitle').value.trim(); if (v) sendWs({ t: 'title', uid, add: v }); };
    $('#addtitle').onclick = add; $('#newtitle').onkeydown = e => { if (e.key === 'Enter') add(); };
  }
  if ($('#pedit')) $('#pedit').onclick = () => { closeOverlay(); editProfile(); };
  if ($('#pmention')) $('#pmention').onclick = () => { closeOverlay(); const f = $('#field'); if (f) { f.value = (f.value ? f.value + ' ' : '') + '@' + p.name + ' '; f.focus(); } };
  o.querySelectorAll('[data-pa]').forEach(b => b.onclick = () => {
    const a = b.dataset.pa;
    if (a === 'role') sendWs({ t: 'role', uid, role: p.role === 'mod' ? 'member' : 'mod' });
    if (a === 'mute') sendWs({ t: 'mute', uid, hours: p.muted ? 0 : 24 });
    if (a === 'remove' && confirm(`Remove ${p.name} from the Inner Circle?`)) sendWs({ t: 'remove', uid });
    closeOverlay();
  });
}

function openPeople() {
  const all = Object.values(S.people).filter(p => p.name);
  const on = new Set(S.online);
  all.sort((a, b) => (on.has(b.uid) - on.has(a.uid)) || a.name.localeCompare(b.name));
  const o = overlay(`<div style="padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between"><h2 class="h1" style="font-size:24px">Members</h2><button class="ibtn" id="ppclose" aria-label="Close">${I.close()}</button></div>
    <div style="padding:0 10px 14px;display:flex;flex-direction:column;gap:2px">${all.map(p => `<button class="person" data-pwho="${esc(p.uid)}">${avatar(p.uid, 32)}<span>${esc(p.name)}</span><span class="role">${on.has(p.uid) ? 'here now' : ''}</span></button>`).join('')}</div>
    <div class="phone-only" style="border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn2 sm" id="ppedit">${I.edit(16)}Edit your profile</button>${(S.me.role === 'host' || S.me.role === 'mod') ? `<button class="btn2 sm" id="pprep">${I.shield(16)}Reports${S.reports ? ' (' + S.reports + ')' : ''}</button>` : ''}</div>`, true, 'Members');
  hydrateMedia(o);
  $('#ppclose').onclick = closeOverlay;
  $('#ppedit').onclick = () => { closeOverlay(); editProfile(); };
  if ($('#pprep')) $('#pprep').onclick = () => { closeOverlay(); sendWs({ t: 'reports' }); };
  o.querySelectorAll('[data-pwho]').forEach(b => b.onclick = () => askProfile(b.dataset.pwho));
}

function showReports(m) {
  const byId = {}; for (const x of m.messages) byId[x.id] = x;
  const o = overlay(`<div style="padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between"><h2 class="h1" style="font-size:24px">Reports</h2><button class="ibtn" id="rclose" aria-label="Close">${I.close()}</button></div>
    <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:12px">${m.reports.length ? m.reports.map(r => { const msg = byId[r.msg_id] || {}; return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px">
      <div class="muted" style="font-size:12.5px">${esc(person(r.uid).name)} reported ${esc(person(msg.uid).name)}${r.reason ? ': ' + esc(r.reason) : ''}</div>
      <div style="margin:8px 0;font-size:14.5px">${msg.deleted ? '<span class="deleted">Message deleted</span>' : esc(msg.text || 'Image')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn2 sm" data-rdel="${r.msg_id}" data-rid="${r.id}">Delete message</button><button class="btn2 sm" data-rok="${r.id}">Dismiss</button></div></div>`; }).join('') : '<p class="muted">Nothing to review.</p>'}</div>`, false, 'Reports');
  $('#rclose').onclick = closeOverlay;
  o.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => { sendWs({ t: 'delete', id: Number(b.dataset.rdel) }); sendWs({ t: 'resolve', id: Number(b.dataset.rid) }); b.closest('div[style]').remove(); });
  o.querySelectorAll('[data-rok]').forEach(b => b.onclick = () => { sendWs({ t: 'resolve', id: Number(b.dataset.rok) }); b.closest('div[style]').remove(); });
}

function openLightbox(src) {
  const s = document.createElement('div'); s.className = 'scrim lightbox'; s.id = 'ovl';
  s.innerHTML = `<img src="${esc(src)}" alt="">`; s.onclick = closeOverlay; closeOverlay(); document.body.appendChild(s);
}

// every icon button shows its name on hover
document.addEventListener('mouseover', e => {
  const b = e.target.closest && e.target.closest('button[aria-label],a[aria-label]');
  if (b && !b.hasAttribute('title')) b.setAttribute('title', b.getAttribute('aria-label'));
});
document.addEventListener('visibilitychange', () => { sendWs({ t: 'away', on: away() }); if (!away()) { S.unread = 0; renderMentionBadge(); } });

S.view = S.token ? 'loading' : 'door';
render();
if (S.token) connect();
})();
</script>
</body>
