name = "innerverse-circle"
main = "src/worker.js"
compatibility_date = "2024-11-01"
# Keep the variables set in the dashboard (HOST_EMAILS, MOD_EMAILS) on a wrangler deploy.
keep_vars = true

# The app page is bundled into the Worker as plain text.
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[vars]
# The existing members' Worker that issues and checks Plus+ sessions.
AUTH_URL = "https://innerverse-plus.chance-5da.workers.dev"
# HOST_EMAILS and MOD_EMAILS (who gets the Host and moderator roles, comma separated, lower case)
# are set in the Worker's settings in the Cloudflare dashboard, not here.
# Local testing only: lets "dev." tokens sign in. Must stay "0" when deployed.
DEV_AUTH = "0"
# Sites allowed to talk to this Worker (the page lives on GitHub Pages).
ALLOWED_ORIGINS = "https://circle.innerversepodcast.com,https://www.innerversepodcast.com"
# Super Chat (2026-11-09). The publishable key is public by design; the secret key and the
# webhook signing secret are Worker secrets set in the dashboard, never here.
STRIPE_PUBLISHABLE_KEY = "pk_live_cmpv6GbhX2L8cuo2SvVumGpV"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "innerverse-circle-media"

# Direct link to the members' Worker for login checks.
[[services]]
binding = "AUTH_SVC"
service = "innerverse-plus"
