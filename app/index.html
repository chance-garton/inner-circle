<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0F1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="InnerVerse">
<meta name="description" content="InnerVerse on your phone: every episode, the full Plus+ episodes for members, and the Inner Circle.">
<title>InnerVerse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1320x2868.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1284x2778.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1242x2688.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash/828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash/750x1334.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#0A0F1C; --surface:#111827; --card:#151E33; --card2:#1B2640; --line:rgba(233,238,246,0.12);
  --ink:#E9EEF6; --muted:#9AA6BA; --lapis:#3B74CC; --lapis-lit:#8FB5F0;
  --gold:#D8AA3C; --gold-lit:#E8C46A; --on-gold:#0A0F1C;
  --accent:var(--lapis-lit);
  --brand:'Fjalla One','Arial Narrow',Impact,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --tabh:50px; --gap:0px; --minih:0px;
}
html.member{--accent:var(--gold)}
html.playing{--minih:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* views */
.view{position:fixed;top:0;left:0;right:0;bottom:calc(-1 * var(--gap));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--ground);padding-bottom:calc(var(--tabh) + var(--minih) + max(12px,calc(var(--sb) - 22px)) + 16px)}
#ep{z-index:5;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* headers */
.hdr{position:sticky;top:0;z-index:4;padding:calc(var(--st) + 8px) 16px 10px;background:rgba(10,15,28,0.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.brandmark{display:flex;align-items:center;gap:9px}
.brandmark img{width:34px;height:34px}
.brandmark .word{font-family:var(--brand);font-size:23px;letter-spacing:.04em;text-transform:uppercase}
.brandmark .plus{color:var(--gold);font-family:var(--brand);font-size:23px;margin-left:-4px}
.hdr .sp{flex:1}
.hdr h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:rgba(233,238,246,0.08)}
.eptitle-mini{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.hdr.scrolled .eptitle-mini{opacity:1}

/* type */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2;margin:0}
.sec{margin:28px 0 0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sechead a,.sechead button{font-size:14px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:800;font-size:15px;background:var(--lapis);color:#fff;box-sizing:border-box}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.line{background:transparent;border:2px solid var(--accent);color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--card);margin-top:6px}
.hero .art{aspect-ratio:16/9;width:100%;object-fit:cover;background:var(--card2)}
.hero .body{padding:14px 16px 16px}
.hero .t{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.22;margin:6px 0 4px}
.hero .acts{display:flex;gap:10px;margin-top:12px}
.hero .acts .btn{flex:1}

/* rows */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tile{flex:none;width:min(62vw,240px);scroll-snap-align:start}
.tile .art{aspect-ratio:16/9;width:100%;object-fit:cover;border-radius:12px;background:var(--card2)}
.tile .t{font-weight:700;font-size:14.5px;line-height:1.3;margin:8px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .m{font-size:12.5px;color:var(--muted)}
.tile .bar{height:3px;border-radius:2px;background:rgba(233,238,246,0.14);margin-top:6px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column}
.rowep{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rowep .art{width:128px;flex:none;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--card2)}
.rowep .info{min-width:0;flex:1}
.rowep .k{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rowep .t{font-weight:700;font-size:15px;line-height:1.3;margin:3px 0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rowep .l{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowep .why{font-size:12.5px;color:var(--lapis-lit);margin-top:2px}
.rowep .ext{display:flex;align-items:flex-start;gap:5px;margin-top:4px;font-size:12px;font-weight:700;color:var(--gold);line-height:1.3}
.rowep .ext svg{flex:none;margin-top:1px}
.pchip{display:inline-flex;align-items:center;gap:4px;text-transform:none;letter-spacing:.02em;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid rgba(216,170,60,0.55);color:var(--gold)}

/* search */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:46px;margin-top:8px}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:16px}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input::-webkit-search-cancel-button,.searchbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-gold)}
html:not(.member) .chip.on{color:#0A0F1C}
.reshead{font-family:var(--display);font-size:20px;font-weight:600;margin:18px 0 4px}
.more{display:flex;justify-content:center;padding:18px 0}

/* episode page */
.media{background:#000;border-radius:0;overflow:hidden;margin:0 -16px}
.media .frame{position:relative;aspect-ratio:16/9;width:100%;background:#000}
.media .frame iframe,.media .frame .ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
.media .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.media .bigplay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(10,15,28,0) 40%,rgba(10,15,28,0.65))}
.media .bigplay span{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-gold);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
html:not(.member) .media .bigplay span{color:#fff;background:var(--lapis)}
.toggle{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);width:max-content;margin:14px 0 0}
.toggle button{height:36px;padding:0 18px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.toggle button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.listen{display:flex;align-items:center;gap:14px;padding:14px;margin-top:12px;border-radius:16px;background:var(--card)}
.listen .pp{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--on-gold)}
html:not(.member) .listen .pp{background:var(--lapis);color:#fff}
.listen .lt{min-width:0;flex:1}
.listen .lt b{display:block;font-size:15px}
.listen .lt span{font-size:13px;color:var(--muted)}
.crumb{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;line-height:1.6}
.crumb b{color:var(--accent);font-weight:800}
.title{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.18;margin:0 0 10px;letter-spacing:-.005em}
.desc p{margin:0 0 12px;color:#D5DCE8}
.card{background:var(--card);border-radius:16px;padding:16px}
.card.goldline{border:1px solid rgba(216,170,60,0.4);background:linear-gradient(180deg,rgba(216,170,60,0.08),rgba(216,170,60,0.02)),var(--card)}
.card h3{font-family:var(--display);font-size:20px;font-weight:600;margin:4px 0 6px;line-height:1.25}
.card p{margin:0 0 12px;color:#D5DCE8;font-size:15px}
.card .acts{display:flex;gap:10px;flex-wrap:wrap}
.card .acts .btn{flex:1 1 100%}
.acc{border-top:1px solid var(--line);margin-top:22px}
.acc>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 0;font-family:var(--display);font-size:21px;font-weight:600;text-align:left}
.acc>button svg{transition:transform .2s;color:var(--muted)}
.acc.open>button svg{transform:rotate(180deg)}
.acc .in{display:none;padding-bottom:6px}
.acc.open .in{display:block}
.chap{display:flex;gap:12px;width:100%;text-align:left;padding:10px 8px;border-radius:10px;align-items:baseline}
.chap:active{background:rgba(233,238,246,0.06)}
.chap .tm{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;font-size:14px;min-width:58px}
.chap .ct{font-size:15px;line-height:1.35}
.chap.now{background:rgba(143,181,240,0.1)}
html.member .chap.now{background:rgba(216,170,60,0.1)}
.chap.locked{opacity:.6;cursor:default}
.chap.locked .tm{color:var(--muted)}
.mtag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-left:6px;white-space:nowrap}
.theme{padding:4px 0 14px}
.theme h4{margin:0 0 4px;font-size:16px;font-weight:800;line-height:1.3}
.theme p{margin:0;color:#D5DCE8;font-size:15px}
.quote{padding:14px 0;border-bottom:1px solid var(--line)}
.quote:last-child{border-bottom:0}
.quote blockquote{margin:0 0 10px;font-family:var(--display);font-style:italic;font-size:18px;line-height:1.4}
.quote .who{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--muted)}
.quote .who img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--card2)}
.guest{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.guest:last-child{border-bottom:0}
.guest img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2)}
.guest .n{font-weight:800;font-size:16px}
.guest .r{font-size:13.5px;color:var(--accent);margin-bottom:6px}
.guest .b{font-size:14px;color:#D5DCE8;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.guest .b.full{display:block}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--accent)}

/* tab bar + mini player */
.tabs::after{content:'';position:absolute;left:0;right:0;top:100%;height:120px;background:#0A0F1C}
.tabs{position:fixed;left:0;right:0;bottom:calc(-1 * var(--gap));z-index:10;--tb:max(12px,calc(var(--sb) - 22px));height:calc(var(--tabh) + var(--tb));padding-bottom:var(--tb);display:flex;background:#0A0F1C;border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tabs button.on{color:var(--accent)}
.tabs .dot{position:absolute;top:7px;left:calc(50% + 8px);min-width:8px;height:8px;border-radius:4px;background:var(--gold)}
html.kb .tabs,html.kb .mini{display:none}
.mini{position:fixed;left:8px;right:8px;bottom:calc(-1 * var(--gap) + var(--tabh) + max(12px,calc(var(--sb) - 22px)) + 6px);z-index:10;height:58px;border-radius:14px;background:var(--card2);box-shadow:0 10px 30px rgba(0,0,0,0.5);display:none;align-items:center;gap:10px;padding:0 6px 0 7px;overflow:hidden;border:1px solid var(--line)}
html.playing .mini{display:flex}
.mini img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--card)}
.mini .mt{flex:1;min-width:0;text-align:left}
.mini .mt b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(233,238,246,0.1)}
.mini .prog i{display:block;height:100%;background:var(--accent);width:0}

/* now playing sheet */
.np{position:fixed;top:0;left:0;right:0;bottom:calc(-1 * var(--gap));z-index:30;background:linear-gradient(180deg,#14203A 0%,var(--ground) 60%);display:flex;flex-direction:column;padding:calc(var(--st) + 6px) 20px calc(var(--sb) + 16px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.np.open{transform:none}
.np .grab{display:flex;justify-content:center;padding:4px 0 10px}
.np .art{width:100%;max-width:520px;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin:8px auto 0;box-shadow:0 18px 50px rgba(0,0,0,0.55)}
.np .nt{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.25;margin:20px 0 4px}
.np .nc{color:var(--accent);font-weight:700;font-size:14.5px;min-height:22px}
.np input[type=range]{width:100%;margin:18px 0 2px;accent-color:var(--accent);height:28px}
.np .times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.np .ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 8px}
.np .ctl .big{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--on-gold);display:grid;place-items:center}
html:not(.member) .np .ctl .big{background:var(--lapis);color:#fff}
.np .ctl .sk{width:52px;height:52px;display:grid;place-items:center;position:relative}
.np .ctl .sk small{position:absolute;font-size:10px;font-weight:800;top:19px}
.np .opts{display:flex;justify-content:center;gap:10px;margin:6px 0 14px}
.np .opts button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:13.5px}
.np .chlist{max-width:620px;margin:0 auto;width:100%}

/* chat */
#chatv{overflow:hidden;padding:0}
#chatv iframe{position:absolute;left:0;right:0;top:var(--st);width:100%;height:calc(100% - var(--st) - var(--tabh) - max(12px,calc(var(--sb) - 22px)) - var(--minih));border:0;background:var(--ground)}
html.kb #chatv iframe{height:calc(100% - var(--st))}
.loading{display:grid;place-items:center;padding:60px 0;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(233,238,246,0.15);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* account */
.acct{display:flex;align-items:center;gap:14px}
.acct .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);font-family:var(--brand);font-size:26px;flex:none}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.perk{background:var(--card);border-radius:14px;padding:12px}
.perk b{display:block;font-size:14px;line-height:1.3;margin-bottom:3px}
.perk span{font-size:12.5px;color:var(--muted);line-height:1.4;display:block}
.linkrow{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-bottom:1px solid var(--line);font-weight:700}
.linkrow svg{color:var(--muted)}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:0;margin:8px 0}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

/* install sheet + toast */
.sheetwrap{position:fixed;top:0;left:0;right:0;bottom:calc(-1 * var(--gap));z-index:40;background:rgba(5,8,15,0.6);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:20px 20px calc(var(--sb) + 20px);max-width:620px;margin:0 auto}
.sheet h3{font-family:var(--display);font-size:22px;margin:0 0 8px;font-weight:600}
.sheet ol{margin:8px 0 16px;padding-left:22px}
.sheet li{margin:6px 0}

</style>
</head>
<body>
<section class="view" id="home" aria-label="Home"></section>
<section class="view" id="search" aria-label="Episodes" hidden></section>
<section class="view" id="chatv" aria-label="Inner Circle" hidden></section>
<section class="view" id="me" aria-label="Account" hidden></section>
<section class="view" id="ep" aria-label="Episode" hidden></section>

<button class="mini" id="mini" aria-label="Open the player">
  <img id="miniArt" alt="">
  <span class="mt"><b id="miniT"></b><span id="miniC"></span></span>
  <span class="iconbtn" id="miniPP" role="button" aria-label="Play"></span>
  <span class="prog"><i id="miniBar"></i></span>
</button>
<nav class="tabs" id="tabs" aria-label="App"></nav>
<div class="np" id="np" aria-hidden="true"></div>
<audio id="aud" preload="none" playsinline></audio>
<div id="saprobe" aria-hidden="true" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)"></div>

<script>
(function(){
'use strict';
const VERSION = '2026-10-08h';
const AUTH = 'https://innerverse-plus.chance-5da.workers.dev';
const DATA = 'https://raw.githubusercontent.com/chance-garton/innerverse-data/main/';
const SITE = 'https://www.innerversepodcast.com';
const TOKEN_KEY = 'ivc_token'; // shared with the Inner Circle page on this address
const LOGO = 'https://images.squarespace-cdn.com/content/5987d897cf81e0278ec5322e/9a710a85-f780-4b67-a4c7-2b45690b6006/2025-Electric-Logo-2026.png?format=300w';
const PLUS_LOGO = 'https://images.squarespace-cdn.com/content/5987d897cf81e0278ec5322e/c3607ade-e087-4b27-af0f-e0913f4dc3d0/plus+asset.png?format=300w';
const HOST = 'Chance Garton';
const HOST_PORTRAIT = 'https://images.squarespace-cdn.com/content/5987d897cf81e0278ec5322e/aa717e55-9487-4255-a7df-3f8ef10940c4/Chance+Garton+Patreon+Portrait.png?format=100w';
const FIRST_EPISODES = ['astrotheology-101', 'chris-crutchfield', 'marizelle-arce-terrain-doctor', 'inner-whirled-25', 'keys-to-the-tarot'];
const SHOWS = ['InnerVerse', 'Inner Whirled', 'Vibe Rant', 'Astro-Herbalism', 'Marvelous Demystifiers'];
const THEMES = ['Consciousness & Reality', 'Historical Investigations', 'Myth, Symbolism, & Language', 'Holistic Health'];
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// ------------------------------------------------------------ helpers
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch (e) {} }
function load(k, json) { try { const v = localStorage.getItem(k); return json ? (v ? JSON.parse(v) : null) : v; } catch (e) { return null; } }
function img(url, w) {
  if (!url) return '';
  if (/squarespace-cdn\.com/.test(url)) return url.split('?')[0] + '?format=' + (w || 500) + 'w';
  return url;
}
function parseJSON(s) { if (!s) return []; if (Array.isArray(s)) return s; try { const v = JSON.parse(s); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function clock(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function fmtDate(d) {
  if (!d) return '';
  const t = new Date(d + 'T12:00:00');
  return isNaN(t) ? d : t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
const showName = s => (/^innerverse$/i.test(s) ? 'InnerVerse' : s);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
const P = (d, s, w) => `<svg viewBox="0 0 24 24" width="${s||22}" height="${s||22}" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  home: s => P('<path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/>', s),
  search: s => P('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', s),
  chat: s => P('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 8.5h7M8.5 11.5h4.5"/>', s),
  user: s => P('<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>', s),
  plus: s => P('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>', s),
  back: s => P('<path d="M15 5l-7 7 7 7"/>', s, 2.3),
  share: s => P('<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>', s),
  down: s => P('<path d="m6 9 6 6 6-6"/>', s),
  right: s => P('<path d="m9 6 6 6-6 6"/>', s),
  close: s => P('<path d="M6 6l12 12M18 6 6 18"/>', s),
  lock: s => P('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', s),
  video: s => P('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/>', s),
  head: s => P('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>', s),
  doc: s => P('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', s),
  play: s => `<svg viewBox="0 0 24 24" width="${s||22}" height="${s||22}" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>`,
  pause: s => `<svg viewBox="0 0 24 24" width="${s||22}" height="${s||22}" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>`,
  rew: s => P('<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4.5h4.5"/>', s),
  fwd: s => P('<path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M21 4v4.5h-4.5"/>', s),
  prev: s => P('<path d="M18 6 9 12l9 6zM6 6v12"/>', s),
  next: s => P('<path d="m6 6 9 6-9 6zM18 6v12"/>', s),
};

// ------------------------------------------------------------ state
const S = {
  token: null, member: false, signedIn: false, name: '', email: '', source: '',
  lib: null, tab: 'home', route: '', q: '', show: '', theme: '',
  files: {}, ep: null, chatLoaded: false,
};

// sign-in token from the members' login redirect (#iv_session=...)
(function captureToken() {
  const m = location.hash.match(/iv_session=([^&]+)/);
  if (m) {
    store(TOKEN_KEY, decodeURIComponent(m[1]));
    const after = load('iva_after') || '#/';
    store('iva_after', null);
    history.replaceState(null, '', location.pathname + location.search + (after.indexOf('#/') === 0 ? after : '#/'));
  }
  S.token = load(TOKEN_KEY);
  const last = load('iva_status', true);
  if (S.token && last && last.entitled) { S.member = true; S.signedIn = true; S.name = last.name || ''; S.email = last.email || ''; S.source = last.source || ''; }
  document.documentElement.classList.toggle('member', S.member);
})();

function loginUrl() {
  store('iva_after', location.hash && location.hash.indexOf('#/') === 0 ? location.hash : '#/');
  return AUTH + '/auth/choose?return_to=' + encodeURIComponent(location.origin + location.pathname.replace(/[^/]*$/, ''));
}
function login() { location.href = loginUrl(); }
function logout() {
  store(TOKEN_KEY, null); store('iva_status', null);
  S.token = null; S.member = false; S.signedIn = false; S.name = '';
  applyMember(); toast('You are logged out.');
}

async function checkStatus() {
  if (!S.token) { if (S.member) { S.member = false; applyMember(); } return; }
  try {
    const r = await fetch(AUTH + '/auth/status', { headers: { Authorization: 'Bearer ' + S.token }, cache: 'no-store' });
    const j = await r.json();
    if (!j.signedIn) { store(TOKEN_KEY, null); store('iva_status', null); S.token = null; }
    const was = S.member;
    S.signedIn = !!j.signedIn; S.member = !!(j.signedIn && j.entitled);
    S.name = j.name || ''; S.email = j.email || ''; S.source = j.source || '';
    if (j.signedIn) store('iva_status', { entitled: !!j.entitled, name: j.name, email: j.email, source: j.source });
    if (was !== S.member) applyMember(); else renderMe();
  } catch (e) { /* offline: keep the last known state */ }
}

function applyMember() {
  document.documentElement.classList.toggle('member', S.member);
  renderTabs();
  if (S.lib) { renderHome(); renderSearch(true); }
  renderMe();
  if (!S.member && S.tab === 'chat') go('#/');
  const iframe = $('#chatv iframe');
  if (iframe && !S.member) { iframe.remove(); S.chatLoaded = false; }
  epShown = '';
  route();
}

// ------------------------------------------------------------ data
const cacheFetch = async (url) => {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
};

async function loadLibrary() {
  const [ei, pi, corpus] = await Promise.all([
    cacheFetch(DATA + 'episodes-index.json'),
    cacheFetch(DATA + 'plus-index.json'),
    cacheFetch(DATA + 'episodes/_corpus.json').catch(() => null),
  ]);
  const lines = {};
  if (corpus && corpus.records) for (const r of corpus.records) { const f = r.fields || {}; if (f.Slug) lines[f.Slug] = f['Topic Line'] || ''; }
  const free = (ei.episodes || []).map(e => ({
    key: 'e:' + e.slug, kind: 'free', slug: e.slug, file: e.slug, title: e.title, thumb: e.thumb, date: e.date || '',
    shows: (e.shows || []).map(showName), guests: e.guests || [], tags: e.tags || [], topics: e.topics || [],
    topicLine: e.topicLine || lines[e.slug] || '', duration: e.duration || '',
  }));
  const plus = (pi.episodes || []).filter(e => /\/plus\//.test(e.url || '')).map(e => ({
    key: 'p:' + e.slug, kind: 'plus', slug: e.slug, file: e.freeSlug || e.slug, freeSlug: e.freeSlug || '',
    title: String(e.title || '').replace(/\s*\(PLUS\)\s*$/i, ''), thumb: e.thumb, date: e.date || '',
    shows: (e.shows || []).map(showName), guests: e.guests || [], tags: e.tags || [], topics: e.topics || [],
    topicLine: e.topicLine || lines[e.freeSlug] || '', duration: e.plusDuration || '',
  }));
  const plusByFree = {}, bySlug = {};
  for (const p of plus) { if (p.freeSlug) plusByFree[p.freeSlug] = p; bySlug['p:' + p.slug] = p; }
  for (const f of free) { bySlug['e:' + f.slug] = f; if (plusByFree[f.slug]) f.plus = plusByFree[f.slug]; }
  for (const p of plus) if (p.freeSlug && bySlug['e:' + p.freeSlug]) p.free = bySlug['e:' + p.freeSlug];
  for (const it of free.concat(plus)) {
    it._t = norm(it.title); it._l = norm(it.topicLine); it._g = norm(it.guests.join(' '));
    it._k = norm(it.tags.join(' ')); it._s = norm(it.shows.join(' ')); it._p = norm(it.topics.join(' '));
  }
  const byDate = (a, b) => (b.date || '').localeCompare(a.date || '') || a.title.localeCompare(b.title);
  free.sort(byDate); plus.sort(byDate);
  S.lib = { free, plus, plusByFree, bySlug, byDate };
}
// what this visitor browses: members see the full episodes, and the free copy of any episode that has one disappears
function library() {
  if (!S.lib) return [];
  if (!S.member) return S.lib.free;
  if (!S.lib._member) S.lib._member = S.lib.plus.concat(S.lib.free.filter(f => !f.plus)).sort(S.lib.byDate);
  return S.lib._member;
}
// the best version of an episode for this visitor
function pick(it) { if (!it) return it; if (S.member && it.kind === 'free' && it.plus) return it.plus; if (!S.member && it.kind === 'plus' && it.free) return it.free; return it; }
function epHref(it) { return it.kind === 'plus' ? '#/p/' + it.slug : '#/e/' + it.slug; }
async function episodeFile(name) {
  if (S.files[name]) return S.files[name];
  const j = await cacheFetch(DATA + 'episodes/' + encodeURIComponent(name) + '.json');
  S.files[name] = j; return j;
}

// ------------------------------------------------------------ progress
let PROG = load('iva_prog', true) || {};
function saveProg(key, t, d) {
  if (!key || !d) return;
  if (t > d - 45) delete PROG[key]; else PROG[key] = { t: Math.round(t), d: Math.round(d), at: Date.now() };
  store('iva_prog', PROG);
}

// ------------------------------------------------------------ routing
function go(h) { if (location.hash !== h) location.hash = h; else route(); }
function setTab(tab) {
  S.tab = tab;
  for (const id of ['home', 'search', 'chatv', 'me']) $('#' + id).hidden = (id !== (tab === 'chat' ? 'chatv' : tab));
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'chat') mountChat();
}
let lastTabHash = { home: '#/', search: '#/search', chat: '#/chat', me: '#/me' };
let NAV = [location.hash || '#/'];
function route() {
  const h = location.hash || '#/';
  const m = h.match(/^#\/(e|p)\/([^/?#]+)/);
  if (m) {
    $('#ep').hidden = false;
    openEpisode(m[1], decodeURIComponent(m[2]));
    return;
  }
  closeEpisode();
  if (h.indexOf('#/search') === 0) { setTab('search'); const q = new URLSearchParams(h.split('?')[1] || ''); if (q.has('show') || q.has('q') || q.has('theme')) { S.show = q.get('show') || ''; S.q = q.get('q') || ''; S.theme = q.get('theme') || ''; renderSearch(); } }
  else if (h.indexOf('#/chat') === 0) { if (S.member) setTab('chat'); else { history.replaceState(null, '', '#/me'); setTab('me'); } }
  else if (h.indexOf('#/me') === 0) setTab('me');
  else setTab('home');
}
window.addEventListener('hashchange', () => {
  const h = location.hash || '#/';
  if (NAV.length > 1 && NAV[NAV.length - 2] === h) NAV.pop(); else NAV.push(h);
  route();
});

// ------------------------------------------------------------ tabs
function renderTabs() {
  const t = [['home', 'Home', I.home(24)], ['search', 'Episodes', I.search(24)]];
  if (S.member) t.push(['chat', 'Inner Circle', I.chat(24)]);
  t.push(['me', S.member ? 'Account' : 'Plus+', S.member ? I.user(24) : I.plus(24)]);
  $('#tabs').innerHTML = t.map(x => `<button data-tab="${x[0]}" class="${S.tab === x[0] ? 'on' : ''}">${x[2]}<span>${x[1]}</span></button>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const tab = b.dataset.tab;
  if (tab === S.tab && $('#ep').hidden) { const v = $('#' + (tab === 'chat' ? 'chatv' : tab)); v.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  go({ home: '#/', search: '#/search', chat: '#/chat', me: '#/me' }[tab]);
});

// ------------------------------------------------------------ pieces
function meta(it) {
  const bits = [];
  if (it.shows[0]) bits.push(esc(it.shows[0]));
  if (it.duration) bits.push(esc(it.duration));
  return bits.join(' · ');
}
function progBar(it) { const p = PROG[it.key]; return p && p.d ? `<div class="bar"><i style="width:${Math.min(100, Math.round(p.t / p.d * 100))}%"></i></div>` : ''; }
function tile(it) {
  return `<a class="tile" href="${epHref(it)}"><img class="art" loading="lazy" src="${esc(img(it.thumb, 500))}" alt=""><div class="t">${esc(it.title)}</div><div class="m">${meta(it)}</div>${progBar(it)}</a>`;
}
function rowEp(it, why) {
  let plusMark = '';
  if (!S.member && it.plus) {
    const extra = Math.max(0, durMin(it.plus.duration) - durMin(it.duration));
    plusMark = `<div class="ext">${I.lock(14)}<span>${extra ? extra + ' min Plus+ extension for members' : 'Plus+ extension for members'}</span></div>`;
  }
  return `<a class="rowep" href="${epHref(it)}"><img class="art" loading="lazy" src="${esc(img(it.thumb, 300))}" alt="">
    <div class="info"><div class="k">${meta(it)}</div><div class="t">${esc(it.title)}</div>${it.topicLine ? `<div class="l">${esc(it.topicLine)}</div>` : ''}${plusMark}${why ? `<div class="why">${esc(why)}</div>` : ''}</div></a>`;
}
function headerBrand() {
  return `<a class="brandmark" href="#/"><img src="${S.member ? PLUS_LOGO : LOGO}" alt=""><span class="word">InnerVerse</span>${S.member ? '<span class="plus">PLUS+</span>' : ''}</a>`;
}
function watchScroll(view) {
  view.addEventListener('scroll', () => { const h = $('.hdr', view); if (h) h.classList.toggle('scrolled', view.scrollTop > 4); }, { passive: true });
}
['home', 'search', 'me', 'ep'].forEach(id => watchScroll($('#' + id)));
function plusPitch(compact) {
  return `<div class="card goldline">
    <div class="eyebrow" style="color:var(--gold)">Inside Plus+</div>
    <h3>${compact ? 'Hear the full episodes.' : 'What members get.'}</h3>
    <p>The free show begins the journey. Plus+ is your initiation.</p>
    ${compact ? '' : `<div class="perks">
      <div class="perk"><b>The full extended episodes</b><span>Every conversation in full, long after the free version ends.</span></div>
      <div class="perk"><b>The whole archive open</b><span>Every members' episode across InnerVerse and Inner Whirled.</span></div>
      <div class="perk"><b>The Inner Circle</b><span>The members' chat, right here in the app.</span></div>
      <div class="perk"><b>Chapters on every full episode</b><span>Jump straight to the part you came for.</span></div>
      <div class="perk"><b>A private podcast feed</b><span>Listen in your favorite podcast app.</span></div>
      <div class="perk"><b>Uncut and ad free</b><span>Nothing between you and the conversation.</span></div>
    </div>`}
    <div class="acts"><a class="btn gold" href="${SITE}/plus" target="_blank" rel="noopener">Start your 7-day free trial</a><button class="btn line" data-act="login" style="--accent:var(--gold)">Already a member? Log in</button></div>
    <p class="note">Then $9 a month. Cancel any time. Every full episode, unlocked.</p>
  </div>`;
}
function tunedCard() {
  return `<div class="card"><div class="eyebrow">Get Tuned</div><h3>Biofield Tuning with Chance</h3><p>Remote sound healing sessions over Zoom, from wherever you are.</p><div class="acts"><a class="btn line" href="${SITE}/biofield-tuning" target="_blank" rel="noopener">Explore sessions</a></div></div>`;
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'login') { e.preventDefault(); login(); }
  if (act === 'logout') { e.preventDefault(); logout(); }
  if (act === 'install') { e.preventDefault(); showInstall(true); }
});

// ------------------------------------------------------------ home
function renderHome() {
  const v = $('#home');
  if (!S.lib) { v.innerHTML = `<header class="hdr"><div class="row">${headerBrand()}</div></header><div class="loading"><div class="spin"></div></div>`; return; }
  const lib = library();
  const latest = lib[0];
  const cont = Object.entries(PROG).filter(([k, p]) => p.t > 60 && S.lib.bySlug[k]).sort((a, b) => b[1].at - a[1].at).map(([k]) => pick(S.lib.bySlug[k])).filter((x, i, a) => x && a.indexOf(x) === i).slice(0, 10);
  const firsts = FIRST_EPISODES.map(s => pick(S.lib.bySlug['e:' + s] || S.lib.bySlug['p:' + s])).filter(Boolean);
  const byShow = sh => lib.filter(x => x.shows.includes(sh)).slice(0, 10);
  const showRow = sh => { const xs = byShow(sh); if (!xs.length) return ''; return `<div class="sec"><div class="sechead"><h2 class="h2">${esc(sh)}</h2><a href="#/search?show=${encodeURIComponent(sh)}">See all</a></div><div class="hscroll">${xs.map(tile).join('')}</div></div>`; };
  v.innerHTML = `<header class="hdr"><div class="row">${headerBrand()}<span class="sp"></span>${S.member ? '' : '<button class="btn line" data-act="login" style="min-height:36px;padding:0 14px;font-size:14px">Log in</button>'}</div></header>
  <div class="wrap">
    ${latest ? `<div class="eyebrow" style="margin-top:8px">${S.member ? 'Newest full episode' : 'Newest episode'}</div>

const FIELDS = [['_t', 6, 'title'], ['_g', 5, 'guest'], ['_l', 4, 'topic'], ['_k', 3, 'subject'], ['_s', 2, 'show'], ['_p', 1.5, 'theme']];
function scoreItem(it, terms, phrase) {
  let total = 0, hit = 0, why = '';

    let best = 0, bw = '';

      const v = ' ' + it[f];

  n.innerHTML = `<div class="grab"><button class="iconbtn" id="npClose" aria-label="Close the player">${I.down(28)}</button></div>
    <img class="art" src="${esc(img(cur.thumb, 750))}" alt="">
    <div style="max-width:620px;margin:0 auto;width:100%">
      <div class="nt">${esc(cur.title)}</div><div class="nc" id="npC">${esc(currentChapterTitle())}</div>
      <input type="range" id="npR" min="0" max="${Math.max(1, Math.floor(d))}" step="1" value="${Math.floor(aud.currentTime)}" aria-label="Position">
      <div class="times"><span id="npT">${clock(aud.currentTime)}</span><span id="npD">-${clock(Math.max(0, d - aud.currentTime))}</span></div>
      <div class="ctl">
        <button class="sk" id="npPrev" aria-label="Previous chapter">${I.prev(24)}</button>
        <button class="sk" id="npBack" aria-label="Back 15 seconds">${I.rew(34)}<small>15</small></button>
        <button class="big" id="npPP" aria-label="${aud.paused ? 'Play' : 'Pause'}">${aud.paused ? I.play(36) : I.pause(36)}</button>
        <button class="sk" id="npFwd" aria-label="Forward 30 seconds">${I.fwd(34)}<small>30</small></button>
        <button class="sk" id="npNext" aria-label="Next chapter">${I.next(24)}</button>
      </div>
      <div class="opts"><button id="npSpeed">${speed}x speed</button><button id="npEp">Episode page</button></div>
    </div>
    ${cur.chapters && cur.chapters.length ? `<div class="chlist"><div class="eyebrow" style="margin:6px 8px 6px">Chapters</div><div id="npChaps">${cur.chapters.map((c, i) => `<button class="chap" data-i="${i}"><span class="tm">${clock(c.seek)}</span><span class="ct">${esc(c.title)}</span></button>`).join('')}</div></div>` : ''}`;
  $('#npClose').addEventListener('click', closeNP);
  $('#npPP').addEventListener('click', togglePlay);
  $('#npBack').addEventListener('click', () => { aud.currentTime = Math.max(0, aud.currentTime - 15); });
  $('#npFwd').addEventListener('click', () => { aud.currentTime = Math.min(aud.duration || 1e9, aud.currentTime + 30); });
  $('#npPrev').addEventListener('click', () => jumpChapter(-1));
  $('#npNext').addEventListener('click', () => jumpChapter(1));
  $('#npSpeed').addEventListener('click', e => { const s = [1, 1.25, 1.5, 1.75, 2, 0.8]; speed = s[(s.indexOf(speed) + 1) % s.length]; aud.playbackRate = speed; store('iva_speed', String(speed)); e.target.textContent = speed + 'x speed'; });
  $('#npEp').addEventListener('click', () => { closeNP(); go('#/' + (cur.kind === 'p' ? 'p' : 'e') + '/' + cur.slug); });
  const r = $('#npR'); let drag = false;
  r.addEventListener('input', () => { drag = true; $('#npT').textContent = clock(r.value); });
  r.addEventListener('change', () => { aud.currentTime = Number(r.value); drag = false; });
  r._drag = () => drag;
  const nc = $('#npChaps'); if (nc) nc.addEventListener('click', e => { const b = e.target.closest('.chap'); if (!b) return; aud.currentTime = cur.chapters[+b.dataset.i].seek; if (aud.paused) togglePlay(); });
  updateNP();
}
function updateNP() {
  const r = $('#npR'); if (!r || !cur) return;
  const d = aud.duration || cur.dur || 0;
  if (r.max != Math.floor(d) && d) r.max = Math.floor(d);
  if (!(r._drag && r._drag())) { r.value = Math.floor(aud.currentTime); $('#npT').textContent = clock(aud.currentTime); }
  $('#npD').textContent = '-' + clock(Math.max(0, d - aud.currentTime));
  $('#npC').textContent = currentChapterTitle();
  const i = currentChapterIndex();
  $$('#npChaps .chap').forEach((c, k) => c.classList.toggle('now', k === i));
}
// swipe down to close the player
(function () { const n = $('#np'); let y0 = null; n.addEventListener('touchstart', e => { if (n.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true }); n.addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeNP(); y0 = null; }, { passive: true }); })();

// ------------------------------------------------------------ install help (iPhone Safari)
function showInstall(force) {
  if (standalone) return;
  if (!force && (!isIOS || load('iva_noinstall'))) return;
  const w = document.createElement('div'); w.className = 'sheetwrap';
  w.innerHTML = `<div class="sheet" role="dialog" aria-label="Add to Home Screen"><h3>Put InnerVerse on your Home Screen</h3><p class="muted" style="margin:0">It opens like an app, keeps playing while you browse, and updates itself.</p>
  <ol><li>Tap the Share button ${I.share(18)} in Safari's toolbar.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>, then open InnerVerse from your Home Screen.</li></ol>
  <button class="btn block${S.member ? ' gold' : ''}" id="instOk">Got it</button></div>`;
  document.body.appendChild(w);
  const close = () => { w.remove(); store('iva_noinstall', '1'); };
  $('#instOk', w).addEventListener('click', close);
  w.addEventListener('click', e => { if (e.target === w) close(); });
}

// ------------------------------------------------------------ fill the whole screen
// On some iPhones a home-screen app's page stops short of the bottom of the screen (by about the status bar's height),
// leaving a blank strip under fixed bars. Measure it and let the bars and pages reach the real bottom.
function insets() {
  try { const cs = getComputedStyle($('#saprobe')); return { top: Math.round(parseFloat(cs.paddingTop) || 0), bottom: Math.round(parseFloat(cs.paddingBottom) || 0) }; } catch (e) { return { top: 0, bottom: 0 }; }
}
function measureGap() {
  try {
    if (window.visualViewport && window.visualViewport.height < window.innerHeight - 120) return; // keyboard open
    let gap = 0;
    if (standalone && isIOS) {
      const portrait = window.innerHeight > window.innerWidth;
      const sh = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
      const short = Math.round(sh - window.innerHeight);
      const top = insets().top;
      if (short > 0) gap = top > 0 ? Math.min(short, top) : (short <= 70 ? short : 0);
    }
    window.__ivaGap = gap;
  } catch (e) {}
}
function screenReport() {
  const i = insets();
  return 'screen ' + screen.height + ' · window ' + window.innerHeight + ' · top ' + i.top + ' · bottom ' + i.bottom + ' · gap ' + (window.__ivaGap || 0);
}
measureGap();
window.addEventListener('resize', measureGap);
window.addEventListener('orientationchange', () => setTimeout(measureGap, 300));

// ------------------------------------------------------------ boot
renderTabs(); renderHome(); renderSearch(); renderMe();
if (cur) { showMini(); updateMediaSession(); }
route();
loadLibrary().then(() => {
  renderHome(); renderSearch(); route();
}).catch(() => {
  $('#home').innerHTML = `<header class="hdr"><div class="row">${headerBrand()}</div></header><div class="wrap"><div class="empty">The episodes could not load. Check your connection and pull this screen down or reopen the app.<br><br><button class="btn line" onclick="location.reload()">Try again</button></div></div>`;
});
checkStatus();
function checkUpdate() {
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = (v || '').trim();
    if (v && v !== VERSION && !(cur && !aud.paused) && !videoOwns) location.reload();
  }).catch(() => {});
}
setTimeout(checkUpdate, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkStatus(); checkUpdate(); } else if (cur && aud.currentTime) saveProg(cur.key, aud.currentTime, aud.duration || cur.dur); });
setTimeout(() => showInstall(false), 2500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
