<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1284x2778.png">

<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash/828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash/750x1334.png">

<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&family=IM+Fell+Great+Primer&display=swap">
<style>
:root{
  --ground:#0A0F1C; --surface:#111827; --card:#151E33; --card2:#1B2640; --line:rgba(233,238,246,0.12);
  --ink:#E9EEF6; --muted:#9AA6BA; --lapis:#3B74CC; --lapis-lit:#8FB5F0;
  --gold:#D8AA3C; --gold-lit:#E8C46A; --on-gold:#0A0F1C;
  --accent:var(--lapis-lit);
  --brand:'Fjalla One','Arial Narrow',Impact,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --tabh:0px; --gap:0px; --minih:0px;
}
html.member{--accent:var(--gold)}
html.playing{--minih:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* an app, not a page: no stray highlighting or press-and-hold callouts, except where you type */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{touch-action:pan-x pan-y;margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
*{touch-action:pan-x pan-y}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* views */
.view{position:fixed;top:0;left:0;right:0;bottom:calc(-1 * var(--gap));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--ground);padding-bottom:calc(var(--tabh) + var(--minih) + max(12px,calc(var(--sb) - 22px)) + 16px)}
#ep{z-index:5;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* headers */
.hdr{position:sticky;top:0;z-index:4;padding:calc(var(--st) + 8px) 16px 10px;background:rgba(10,15,28,0.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr .row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.brandmark{display:flex;align-items:center;gap:9px}
.brandmark img{width:34px;height:34px}
.brandmark .word{font-family:var(--brand);font-size:23px;letter-spacing:.04em;text-transform:uppercase}
.brandmark .plus{color:var(--gold);font-family:var(--brand);font-size:23px;margin-left:-4px}
.hdr .sp{flex:1}
.hdr h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:rgba(233,238,246,0.08)}
.eptitle-mini{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.hdr.scrolled .eptitle-mini{opacity:1}

/* type */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2;margin:0}
.sec{margin:28px 0 0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sechead a,.sechead button{font-size:14px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:800;font-size:15px;background:var(--lapis);color:#fff;box-sizing:border-box}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.line{background:transparent;border:2px solid var(--accent);color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--card);margin-top:6px}
.hero .art{aspect-ratio:16/9;width:100%;object-fit:cover;background:var(--card2)}
.hero .body{padding:14px 16px 16px}
.hero .t{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.22;margin:6px 0 4px}
.hero .acts{display:flex;gap:10px;margin-top:12px}
.hero .acts .btn{flex:1}

/* rows */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tile{flex:none;width:min(62vw,240px);scroll-snap-align:start}
.tile .art{aspect-ratio:16/9;width:100%;object-fit:cover;border-radius:12px;background:var(--card2)}
.tile .t{font-weight:700;font-size:14.5px;line-height:1.3;margin:8px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .m{font-size:12.5px;color:var(--muted)}
.tile .bar{height:3px;border-radius:2px;background:rgba(233,238,246,0.14);margin-top:6px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column}
.rowep{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rowep .artc{width:128px;flex:none}
.rowep .art{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--card2)}
.rowep .d{margin-top:6px;font-size:12px;line-height:1.2;color:var(--muted);text-align:center;letter-spacing:.02em}
.rowep .info{min-width:0;flex:1}
.rowep .k{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rowep .t{font-weight:700;font-size:15px;line-height:1.3;margin:3px 0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rowep .l{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowep .why{font-size:12.5px;color:var(--lapis-lit);margin-top:2px}
.rowep .ext{display:flex;align-items:flex-start;gap:5px;margin-top:4px;font-size:12px;font-weight:700;color:var(--gold);line-height:1.3}
.rowep .ext svg{flex:none;margin-top:1px}
.pchip{display:inline-flex;align-items:center;gap:4px;text-transform:none;letter-spacing:.02em;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid rgba(216,170,60,0.55);color:var(--gold)}

/* search */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:46px;margin-top:8px}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:16px}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input::-webkit-search-cancel-button,.searchbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-gold)}
html:not(.member) .chip.on{color:#0A0F1C}
.reshead{font-family:var(--display);font-size:20px;font-weight:600;margin:18px 0 4px}
.more{display:flex;justify-content:center;padding:18px 0}

/* episode page */
.media{background:#000;border-radius:0;overflow:hidden;margin:0 -16px}
.media .frame{position:relative;aspect-ratio:16/9;width:100%;background:#000}
.media .frame iframe,.media .frame .ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
.media .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.media .bigplay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(10,15,28,0) 40%,rgba(10,15,28,0.65))}
.media .bigplay span{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-gold);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
html:not(.member) .media .bigplay span{color:#fff;background:var(--lapis)}
.toggle{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);width:max-content;margin:14px 0 0}
.toggle button{height:36px;padding:0 18px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.toggle button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.listen{display:flex;align-items:center;gap:14px;padding:14px;margin-top:12px;border-radius:16px;background:var(--card)}
.listen .pp{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--on-gold)}
html:not(.member) .listen .pp{background:var(--lapis);color:#fff}
.listen .lt{min-width:0;flex:1}
.listen .lt b{display:block;font-size:15px}
.listen .lt span{font-size:13px;color:var(--muted)}
.crumb{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;line-height:1.6}
.crumb b{color:var(--accent);font-weight:800}
.title{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.18;margin:0 0 10px;letter-spacing:-.005em}
.desc p{margin:0 0 12px;color:#D5DCE8}
.card{background:var(--card);border-radius:16px;padding:16px}
.card.goldline{border:1px solid rgba(216,170,60,0.4);background:linear-gradient(180deg,rgba(216,170,60,0.08),rgba(216,170,60,0.02)),var(--card)}
.card h3{font-family:var(--display);font-size:20px;font-weight:600;margin:4px 0 6px;line-height:1.25}
.card p{margin:0 0 12px;color:#D5DCE8;font-size:15px}
.card .acts{display:flex;gap:10px;flex-wrap:wrap}
.card .acts .btn{flex:1 1 100%}
.acc{border-top:1px solid var(--line);margin-top:22px}
.acc>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 0;font-family:var(--display);font-size:21px;font-weight:600;text-align:left}
.acc>button svg{transition:transform .2s;color:var(--muted)}
.acc.open>button svg{transform:rotate(180deg)}
.acc .in{display:none;padding-bottom:6px}
.acc.open .in{display:block}
.chap{display:flex;gap:12px;width:100%;text-align:left;padding:10px 8px;border-radius:10px;align-items:baseline}
.chap:active{background:rgba(233,238,246,0.06)}
.chap .tm{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;font-size:14px;min-width:58px}
.chap .ct{font-size:15px;line-height:1.35}
.chap.now{background:rgba(143,181,240,0.1)}
html.member .chap.now{background:rgba(216,170,60,0.1)}
.chap.locked{opacity:.6;cursor:default}
.chap.locked .tm{color:var(--muted)}
.mtag{font-size:17px;font-weight:800;line-height:1;color:var(--gold);margin-left:6px;white-space:nowrap}
.theme{padding:4px 0 14px}
.theme h4{margin:0 0 4px;font-size:16px;font-weight:800;line-height:1.3}
.theme p{margin:0;color:#D5DCE8;font-size:15px}
.quote{padding:14px 0;border-bottom:1px solid var(--line)}
.quote:last-child{border-bottom:0}
.quote blockquote{margin:0 0 10px;font-family:var(--display);font-style:italic;font-size:18px;line-height:1.4}
.quote .who{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--muted)}
.quote .who img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--card2)}
.guest{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.guest:last-child{border-bottom:0}
.guest img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2)}
.guest .n{font-weight:800;font-size:16px}
.guest .r{font-size:13.5px;color:var(--accent);margin-bottom:6px}
.guest .b{font-size:14px;color:#D5DCE8;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.guest .b.full{display:block}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--accent)}

/* tab bar + mini player */
.tabs{display:none!important}
/* nav: chat and menu buttons in every header, menu pops out from the top right (build 2026-10-20a) */
.navbtns{display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.navbtns .iconbtn{position:relative}
.navbtns .dot,.menu .dot{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--on-gold);font-size:11px;font-weight:800;line-height:18px;text-align:center}
.navbtns .dot:empty,.menu .dot:empty{display:none}
/* the Chat button is a gold pill so it catches the eye, and glows while messages are waiting (build 2026-10-20c) */
.navbtns .chatpill{width:auto;height:36px;padding:0 14px 0 11px;margin-right:4px;border-radius:999px;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;gap:6px;font-weight:800;font-size:14.5px;letter-spacing:.2px;box-shadow:0 4px 14px rgba(216,170,60,0.28)}
.navbtns .chatpill:active{background:#C99A2E}
.navbtns .chatpill .dot{top:-6px;right:-6px;background:#F4F6FA;color:#0A0F1C;box-shadow:0 0 0 2px var(--ground)}
.navbtns .chatpill.has{animation:chatglow 2.6s ease-in-out infinite}
@keyframes chatglow{0%,100%{box-shadow:0 4px 14px rgba(216,170,60,0.28)}50%{box-shadow:0 0 0 5px rgba(216,170,60,0.22),0 4px 22px rgba(216,170,60,0.55)}}
@media (prefers-reduced-motion:reduce){.navbtns .chatpill.has{animation:none;box-shadow:0 0 0 3px rgba(216,170,60,0.3),0 4px 18px rgba(216,170,60,0.5)}}
.menuwrap{position:fixed;inset:0;z-index:65;display:none}
html.menuopen .menuwrap{display:block}
/* opened in a browser rather than from the home screen: the install page, not the app (build 2026-10-26c) */
.gate{position:fixed;inset:0;z-index:85;overflow-y:auto;-webkit-overflow-scrolling:touch;color:var(--ink);text-align:center;
  background:radial-gradient(110% 55% at 50% 0%,rgba(59,116,204,.32),transparent 62%),radial-gradient(90% 45% at 50% 100%,rgba(216,170,60,.16),transparent 62%),linear-gradient(180deg,#0B1222,#070B15);
  padding:calc(var(--st) + 36px) 20px calc(var(--sb) + 36px)}
.gate::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,#cfe0ff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 64% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 62%,#e8c46a 50%,transparent 51%),radial-gradient(1px 1px at 88% 72%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 8% 88%,#cfe0ff 50%,transparent 51%)}
.gate .gin{position:relative;max-width:460px;margin:0 auto}
.gate .glogo{display:block;margin:0 auto;width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(59,116,204,.7));animation:gfloat 6s ease-in-out infinite}
@keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gate .gword{font-family:var(--brand);font-size:30px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 0}
.gate h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin:22px 0 10px}
.gate .glead{color:#C6CFDD;font-size:16px;line-height:1.55;margin:0 auto;max-width:380px}
.gate .gtabs{display:inline-flex;gap:4px;margin:26px 0 0;padding:4px;border-radius:99px;background:rgba(233,238,246,.07);border:1px solid var(--line)}
.gate .gtabs button{min-height:38px;padding:0 16px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted)}
.gate .gtabs button.on{background:var(--lapis);color:#fff}
.gate .gcard{margin:16px 0 0;padding:20px;border-radius:22px;background:rgba(21,30,51,.85);border:1px solid rgba(233,238,246,.12);text-align:left;box-shadow:0 18px 44px rgba(0,0,0,.4)}
.gate ol{margin:0;padding:0;list-style:none;counter-reset:g}
.gate li{position:relative;padding:0 0 0 44px;margin:0 0 16px;font-size:16px;line-height:1.45;counter-increment:g}
.gate li:last-child{margin-bottom:0}
.gate li::before{content:counter(g);position:absolute;left:0;top:-3px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(143,181,240,.16);color:var(--lapis-lit);border:1px solid rgba(143,181,240,.35)}
.gate li svg{vertical-align:-4px;color:var(--lapis-lit)}
.gate .kbd{display:inline-block;padding:1px 7px;border-radius:6px;background:rgba(233,238,246,.1);border:1px solid var(--line);font-size:14px;font-weight:700}
.gate .gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin:18px 0 0;border-radius:99px;background:var(--lapis);color:#fff;font-weight:800;font-size:16px}
.gate .gqr{display:flex;align-items:center;gap:16px;margin:16px 0 0;padding:16px;border-radius:18px;background:rgba(233,238,246,.05);border:1px solid var(--line)}
.gate .gqr .code{width:112px;height:112px;flex:none;padding:8px;border-radius:12px;background:#fff}
.gate .gqr .code svg{width:100%;height:100%;display:block}

const S = {

// sign-in token from the members' login redirect (#iv_session=...)
(function captureToken() {
  const m = location.hash.match(/iv_session=([^&]+)/);
  const hm = location.search.match(/[?&]h=([A-Za-z0-9_-]{22,64})/);
  if (m) {
    const tok = decodeURIComponent(m[1]);
    store(TOKEN_KEY, tok);
    store('iva_handoff', null);
    // the login finished outside the home-screen app (Safari): hand it back to the app
    if (hm && !standalone) {
      S.handoff = 'sending';
      fetch(CIRCLE_API + '/api/handoff', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ h: hm[1], token: tok }) })
        .then(r => { S.handoff = r.ok ? 'sent' : 'failed'; showHandoffDone(); }, () => { S.handoff = 'failed'; showHandoffDone(); });
    }
    S.fromLogin = true;
    const after = load('iva_after') || '#/';
    store('iva_after', null);
    history.replaceState(null, '', location.pathname + (after.indexOf('#/') === 0 ? after : '#/'));
  }
  S.token = load(TOKEN_KEY);
  const last = load('iva_status', true);
  if (S.token && last && last.entitled) { S.member = true; S.signedIn = true; S.name = last.name || ''; S.email = last.email || ''; S.source = last.source || ''; }
  document.documentElement.classList.toggle('member', S.member);
})();

// the app reopens on the screen it was left on (Chance, 2026-10-20: "open where I left off");
// a login return, a notification or a shared link brings its own address and wins
(function restorePlace() {
  if (S.fromLogin || (location.hash && location.hash !== '#/') || /[?&]h=/.test(location.search)) return;
  const l = load('iva_last');
  if (l && l !== '#/' && /^#\/(e|p|songs|search|library|chat|me)\b/.test(l)) history.replaceState(null, '', location.pathname + location.search + l);
})();
function loginUrl(h) {
  store('iva_after', location.hash && location.hash.indexOf('#/') === 0 ? location.hash : '#/');
  return AUTH + '/auth/choose?return_to=' + encodeURIComponent(location.origin + location.pathname.replace(/[^/]*$/, '') + (h ? '?h=' + h : ''));
}
// In the home-screen app the login carries a one-time code. If it finishes in Safari (Patreon often
// does, or the Patreon app takes over), that page passes the sign-in to the chat server under the
// code, and the app, which keeps asking with the same code, picks it up when they come back.
function newCode() { const b = new Uint8Array(24); crypto.getRandomValues(b); return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function handoffPending() { const p = load('iva_handoff', true); return p && p.h && Date.now() - p.at < 15 * 60 * 1000 ? p : null; }
function login() {
  if (!standalone) { location.href = loginUrl(); return; }
  const h = newCode();
  store('iva_handoff', { h, at: Date.now() });
  showHandoffBar(); pollHandoff();
  // The login opens in its own browser window and the app stays where it is, waiting (2026-10-19). Sending the
  // app itself off to the login pages left it stuck on Home when the login needed an emailed code, so a member
  // had to force close it. The window hands the sign-in back through the handoff above.
  const url = loginUrl(h);
  let w = null; try { w = window.open(url, '_blank'); } catch (e) {}
  if (!w) location.href = url;
}
let hoTimer = null;
function showHandoffBar() {
  let b = $('#hobar');
  if (!handoffPending() || S.member) { if (b) b.remove(); clearInterval(hoTimer); hoTimer = null; return; }
  if (!b) {
    b = document.createElement('div'); b.id = 'hobar'; b.className = 'hobar'; b.setAttribute('role', 'status');
    b.innerHTML = '<div class="spin"></div><div style="flex:1;min-width:0"><b>Finishing your login</b>Log in in the window that just opened, then come back here. This finishes by itself.</div><button type="button" id="hoCancel">Cancel</button>';
    document.body.appendChild(b);
    b.querySelector('#hoCancel').onclick = () => { store('iva_handoff', null); showHandoffBar(); };
  }
  if (!hoTimer) hoTimer = setInterval(pollHandoff, 2500);
}
let hoBusy = false;
async function pollHandoff() {
  const p = handoffPending(); if (!p) { showHandoffBar(); return; }
  if (hoBusy || document.visibilityState === 'hidden') return; hoBusy = true;
  try {
    const r = await fetch(CIRCLE_API + '/api/handoff?h=' + encodeURIComponent(p.h), { cache: 'no-store' });
    const j = await r.json();
    if (j.token) {
      store('iva_handoff', null); store(TOKEN_KEY, j.token); S.token = j.token;
      showHandoffBar();
      await checkStatus();
      toast(S.member ? 'You are logged in.' : 'Logged in, but this account has no active Plus+ membership.');
      const after = load('iva_after'); store('iva_after', null);
      if (after && after.indexOf('#/') === 0) go(after);
    }
  } catch (e) { /* try again shortly */ }
  hoBusy = false;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && handoffPending()) pollHandoff(); });
function showHandoffDone() {
  if (S.handoff === 'sending' || $('#hodone')) return;
  const ok = S.handoff === 'sent';
  const d = document.createElement('div'); d.id = 'hodone'; d.className = 'hodone';
  d.innerHTML = `<div style="max-width:360px"><img src="${PLUS_LOGO}" alt="" style="width:64px;height:64px;display:block;margin:0 auto"><h2>${ok ? 'You are logged in' : 'Almost there'}</h2>
    <p class="muted" style="font-size:16px;line-height:1.55">${ok ? 'Go back to the InnerVerse app on your home screen. It will finish logging you in by itself. You can close this tab.' : 'Your login worked here, but it could not be passed to the home screen app. Open the app and log in again, or use "Trouble logging in?" there.'}</p>
    ${gated ? '' : '<button class="btn line block" id="hoStay" style="margin-top:22px">Keep using InnerVerse here instead</button>'}</div>`;
  document.body.appendChild(d);
  if (d.querySelector('#hoStay')) d.querySelector('#hoStay').onclick = () => d.remove();
}
function logout() {
  store(TOKEN_KEY, null); store('iva_status', null);
  S.token = null; S.member = false; S.signedIn = false; S.name = '';
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch (e) {}
  S.chatUnread = 0;
  applyMember(); toast('You are logged out.');
}

async function checkStatus() {
  if (!S.token) { if (S.member) { S.member = false; applyMember(); } return; }
  try {
    const r = await fetch(AUTH + '/auth/status', { headers: { Authorization: 'Bearer ' + S.token }, cache: 'no-store' });
    const j = await r.json();
    if (!j.signedIn) { store(TOKEN_KEY, null); store('iva_status', null); S.token = null; }
    // logins no longer run out (2026-10-19): an older sign-in is swapped for a lasting one; membership is checked live each time
    if (j.signedIn && j.renew && typeof j.renew === 'string') { store(TOKEN_KEY, j.renew); S.token = j.renew; }
    const was = S.member;
    S.signedIn = !!j.signedIn; S.member = !!(j.signedIn && j.entitled);
    S.name = j.name || ''; S.email = j.email || ''; S.source = j.source || '';
    if (j.signedIn) store('iva_status', { entitled: !!j.entitled, name: j.name, email: j.email, source: j.source });
    if (was !== S.member) applyMember(); else renderMe();
  } catch (e) { /* offline: keep the last known state */ }
}

function applyMember() {
  document.documentElement.classList.toggle('member', S.member);
  renderTabs();
  if (S.lib) { renderHome(); renderSearch(true); renderLib(true); }
  renderMe();
  const iframe = $('#chatv iframe');
  if (iframe && !S.member) { iframe.remove(); S.chatLoaded = false; }
  if (S.tab === 'chat') { if (S.member) { const dv = $('#chatv'); dv.classList.remove('doorv'); const door = $('#chatdoor'); if (door) door.remove(); mountChat(); } else renderChatDoor(); }
  loadMyLib().then(refreshLibViews);
  epShown = '';
  route();
}

// ------------------------------------------------------------ data
const cacheFetch = async (url) => {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
};

async function loadLibrary() {
  const [ei, pi, corpus] = await Promise.all([
    cacheFetch(DATA + 'episodes-index.json'),
    cacheFetch(DATA + 'plus-index.json'),
    cacheFetch(DATA + 'episodes/_corpus.json').catch(() => null),
    loadSongs(),
  ]);
  const lines = {};
  if (corpus && corpus.records) for (const r of corpus.records) { const f = r.fields || {}; if (f.Slug) lines[f.Slug] = f['Topic Line'] || ''; }
  const free = (ei.episodes || []).map(e => ({
    key: 'e:' + e.slug, kind: 'free', slug: e.slug, file: e.slug, title: e.title, thumb: e.thumb, date: e.date || '',
    shows: (e.shows || []).map(showName), guests: e.guests || [], tags: e.tags || [], topics: e.topics || [],
    topicLine: e.topicLine || lines[e.slug] || '', duration: e.duration || '',
  }));
  const plus = (pi.episodes || []).filter(e => /\/plus\//.test(e.url || '')).map(e => ({
    key: 'p:' + e.slug, kind: 'plus', slug: e.slug, file: e.freeSlug || e.slug, freeSlug: e.freeSlug || '',
    title: String(e.title || '').replace(/\s*\(PLUS\)\s*$/i, ''), thumb: e.thumb, date: e.date || '',
    shows: (e.shows || []).map(showName), guests: e.guests || [], tags: e.tags || [], topics: e.topics || [],
    topicLine: e.topicLine || lines[e.freeSlug] || '', duration: e.plusDuration || '',
  }));
  const plusByFree = {}, bySlug = {};
  for (const p of plus) { if (p.freeSlug) plusByFree[p.freeSlug] = p; bySlug['p:' + p.slug] = p; }
  for (const f of free) { bySlug['e:' + f.slug] = f; if (plusByFree[f.slug]) f.plus = plusByFree[f.slug]; }
  for (const p of plus) if (p.freeSlug && bySlug['e:' + p.freeSlug]) p.free = bySlug['e:' + p.freeSlug];
  for (const it of free.concat(plus)) {
    it._t = norm(it.title); it._l = norm(it.topicLine); it._g = norm(it.guests.join(' '));
    it._k = norm(it.tags.join(' ')); it._s = norm(it.shows.join(' ')); it._p = norm(it.topics.join(' '));
  }
  const byDate = (a, b) => (b.date || '').localeCompare(a.date || '') || a.title.localeCompare(b.title);
  free.sort(byDate); plus.sort(byDate);
  S.lib = { free, plus, plusByFree, bySlug, byDate };
  sortSongs();
}
// what this visitor browses: members see the full episodes, and the free copy of any episode that has one disappears
function library() {
  if (!S.lib) return [];
  if (!S.member) return S.lib.free;
  if (!S.lib._member) S.lib._member = S.lib.plus.concat(S.lib.free.filter(f => !f.plus)).sort(S.lib.byDate);
  return S.lib._member;
}
// the best version of an episode for this visitor
function pick(it) { if (!it) return it; if (S.member && it.kind === 'free' && it.plus) return it.plus; if (!S.member && it.kind === 'plus' && it.free) return it.free; return it; }
function epHref(it) { return it.kind === 'plus' ? '#/p/' + it.slug : '#/e/' + it.slug; }
async function episodeFile(name) {
  if (S.files[name]) return S.files[name];
  const j = await cacheFetch(DATA + 'episodes/' + encodeURIComponent(name) + '.json');
  S.files[name] = j; return j;

// ------------------------------------------------------------ episode songs
// songs/songs.json lists the original songs (one to three per episode), in the order shown; free for everyone.
// A song is keyed by its own id; s.episode is the episode's free slug. Hearts are kept as 's:<id>' in My library.
let SONGLIST = [];
async function loadSongs() {
  try {
    const j = await cacheFetch(SONGS + 'songs.json');
    SONGLIST = (j.songs || []).filter(s => s && s.id && s.episode && s.file && s.title);
  } catch (e) { SONGLIST = []; }
}
// newest episode first, by the episode's release date (Chance, 2026-10-19); an episode's own songs keep their track order
// a song's date is its episode's air date (Chance, 2026-10-26: "date of episode of origin"), the day it was added only as a fallback
function songDate(s) { return ((S.lib && S.lib.bySlug['e:' + s.episode]) || {}).date || s.added || ''; }
function sortSongs() {
  const d = songDate;
  SONGLIST = SONGLIST.map((s, i) => [s, i]).sort((a, b) => d(b[0]).localeCompare(d(a[0])) || a[1] - b[1]).map(x => x[0]);
}
function songById(id) { return id ? SONGLIST.find(s => s.id === id) || null : null; }
function songsFor(epSlug) { return epSlug ? SONGLIST.filter(s => s.episode === epSlug) : []; }
function songEp(s) { return S.lib ? pick(S.lib.bySlug['e:' + s.episode] || null) : null; }
function songEpTitle(s) { const ep = songEp(s); return ep ? ep.title : (s.episodeTitle || 'an InnerVerse episode'); }
// square art; until Chance sends a song's art, the episode's thumbnail stands in (cropped square)
function songArtUrl(s, w) { if (s.art) return /^https?:\/\//.test(s.art) ? img(s.art, w || 500) : SONGS + s.art; const ep = songEp(s); return ep ? img(ep.thumb, w || 500) : LOGO; }
function songUrl(s) { return location.origin + '/songs/' + s.id + '/'; }
function songPlaying(s) { return !!(cur && cur.key === 's:' + s.id && !aud.paused && !isSilent()); }
function playSong(s) {
  if (!s) return;
  if (cur && cur.key === 's:' + s.id && aud.src && !isSilent()) { togglePlay(); return; }
  unlockAudio();
  playEpisode({ key: 's:' + s.id, kind: 's', slug: s.episode, title: s.title, show: songEpTitle(s),
    thumb: songArtUrl(s, 500), chapters: [], plus: false, offset: 0, audio: { url: SONGS + s.file } }, 0);
}
// one song ends: the next one on the list starts, like a playlist
// Shuffle (Chance, 2026-10-19): a shuffled order of every song, kept until shuffle is turned off;
// the song playing when it is turned on stays first, and next and previous follow that order
let shuffleOn = load('iva_shuffle') === '1', shuffleQ = null;
function makeShuffle(firstId) {
  const ids = SONGLIST.map(s => s.id).filter(id => id !== firstId);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  shuffleQ = firstId ? [firstId].concat(ids) : ids;
}
function songOrder() {
  if (!shuffleOn) return SONGLIST.map(s => s.id);
  const curId = cur && cur.kind === 's' ? cur.key.slice(2) : null;
  if (!shuffleQ || shuffleQ.length !== SONGLIST.length || (curId && shuffleQ.indexOf(curId) < 0)) makeShuffle(curId);
  return shuffleQ;
}
function setShuffle(on) {
  shuffleOn = !!on; store('iva_shuffle', shuffleOn ? '1' : null);
  if (shuffleOn) makeShuffle(cur && cur.kind === 's' ? cur.key.slice(2) : null); else shuffleQ = null;
  updateSongUI();
}
// Shuffle buttons start a fresh shuffled run from the top; Play all plays the list in order
function shufflePlay() { setShuffle(true); makeShuffle(null); playSong(songById(shuffleQ[0])); toast('Shuffle is on.'); }
function playAll() { setShuffle(false); if (SONGLIST[0]) playSong(SONGLIST[0]); }
function nextSong(dir) {
  const order = songOrder();
  const i = cur ? order.indexOf(cur.key.slice(2)) : -1;
  const n = songById(order[i + dir]);
  if (i >= 0 && n) playSong(n);
}
// hearts: kept in My library under 's:<id>'; a member's heart the account could not take yet waits on this phone
function songPending() { return load('iva_songs_pending', true) || {}; }
function songSaved(s) { const p = songPending(); if (s.id in p) return !!p[s.id]; const x = LIB.get('s:' + s.id); return !!(x && x.saved); }
function savedSongs() {
  const at = s => { const x = LIB.get('s:' + s.id); return (x && x.savedAt) || Date.now(); };
  return SONGLIST.filter(songSaved).sort((a, b) => at(b) - at(a));
}
async function toggleSongHeart(s) {
  const on = !songSaved(s);
  const p = songPending(); p[s.id] = on; store('iva_songs_pending', p);
  updateSongUI(); toast(on ? 'Saved to your library.' : 'Removed from your library.');
  const ok = await libPut('s:' + s.id, { saved: on }, true);
  const q = songPending(); if (ok && q[s.id] === on) { delete q[s.id]; store('iva_songs_pending', Object.keys(q).length ? q : null); }
  refreshLibViews();
}
async function flushSongPending() {
  const p = songPending(); let changed = false;
  for (const id of Object.keys(p)) if (await libPut('s:' + id, { saved: !!p[id] }, true)) { delete p[id]; changed = true; }
  if (changed) store('iva_songs_pending', Object.keys(p).length ? p : null);
}
// the link alone, no words around it (Chance, 2026-10-24: "just a link, no extra text when you paste")
function shareSong(s) {
  const url = songUrl(s);
  if (navigator.share) navigator.share({ url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link copied.'), () => toast(url));
  else toast(url);
}
function updateSongUI() {
  $$('[data-song]').forEach(b => {
    const s = songById(b.dataset.song); if (!s) return;
    const on = songPlaying(s);
    b.classList.toggle('on', on);
    b.setAttribute('aria-label', (on ? 'Pause ' : 'Play ') + s.title);
    const ic = $('.sic', b);
    if (ic) ic.innerHTML = on ? I.pause(ic.dataset.sz || 20) : I.play(ic.dataset.sz || 20);
  });
  $$('[data-shuf-toggle]').forEach(b => { b.classList.toggle('on', shuffleOn); b.setAttribute('aria-pressed', shuffleOn); });
  $$('[data-song-heart]').forEach(b => {
    const s = songById(b.dataset.songHeart); if (!s) return;
    const on = songSaved(s);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    b.setAttribute('aria-label', (on ? 'Remove ' : 'Save ') + s.title + (on ? ' from' : ' to') + ' your library');
    b.innerHTML = I.heart(b.dataset.sz || 20, on);
  });
  // song cards in the chat show play or pause to match (2026-10-24)
  const cf = $('#chatv iframe');
  if (cf) { const id = cur && cur.kind === 's' ? cur.key.slice(2) : ''; try { cf.contentWindow.postMessage({ ivcApp: 1, song: { id, playing: !!(id && !aud.paused && !isSilent()) } }, location.origin); } catch (e) {} }
}
document.addEventListener('click', e => {
  const h = e.target.closest('[data-song-heart]');
  if (h) { e.preventDefault(); toggleSongHeart(songById(h.dataset.songHeart)); return; }
  if (e.target.closest('[data-shuffle]')) { e.preventDefault(); shufflePlay(); return; }
  if (e.target.closest('[data-playall]')) { e.preventDefault(); playAll(); return; }

}
function mdEnd() {
  const r = MD; MD = null; if (!r) return;
  const open = r.v < -0.45 ? true : r.v > 0.45 ? false : r.p > (r.open ? 0.67 : 0.33);
  const H = document.documentElement, m = $('#menu');
  H.classList.remove('mdrag'); H.classList.add('msnap');
  requestAnimationFrame(() => { m.style.transform = open ? 'translateX(0)' : `translateX(${mdW()}px)`; });
  let done = false;
  const fin = () => {
    if (done) return; done = true;
    H.classList.remove('msnap'); m.style.transform = '';
    if (!open) { closeMenu(); H.classList.remove('mswipe'); }
  };
  m.addEventListener('transitionend', fin, { once: true }); setTimeout(fin, 320);
}
function mdStart(e, d) {
  MD = null;
  if (gated) return;
  if (e.touches.length !== 1) return;
  const el = e.target; if (!el || !el.closest) return;
  const open = document.documentElement.classList.contains('menuopen');
  if (!open) {
    if (el.closest(MD_SKIP) || sidewaysScroller(el, d.body)) return;
    if (d !== document) { if (S.tab !== 'chat' || d.getElementById('ovl') || el.closest('.hscroll')) return; } // the chat: only from the chat itself, nothing open on top
    else if (el.closest('.sheetwrap,#menuwrap')) return;
  } else if (d !== document) return;
  const t = e.touches[0];
  MD = { open, d, x0: t.clientX, y0: t.clientY, lx: t.clientX, lt: Date.now(), v: 0, p: open ? 1 : 0, go: false };
}
function mdMove(e) {
  const r = MD; if (!r) return;
  const t = e.touches[0], dx = t.clientX - r.x0, dy = t.clientY - r.y0, now = Date.now();
  if (!r.go) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (!(Math.abs(dx) > Math.abs(dy) * 1.2 && (r.open ? dx > 0 : dx < 0))) { MD = null; return; }
    r.go = true; r.x0 = t.clientX; r.lx = t.clientX; r.lt = now;
    const H = document.documentElement;
    if (!r.open) { try { const a = r.d.activeElement; a && a.blur && a.blur(); } catch (err) {} const m = $('#menu'); m.classList.remove('enter'); m.classList.add('nofx'); renderMenu(); m.scrollTop = 0; H.classList.add('menuopen', 'mswipe'); startMenuMix(); }
    H.classList.add('mdrag'); H.classList.remove('msnap');
    mdSet(r.p);
  }
  e.preventDefault();
  const d = t.clientX - r.x0;
  mdSet(r.open ? 1 - d / mdW() : -d / mdW());
  const dt = now - r.lt; if (dt > 0) r.v = r.v * 0.4 + ((t.clientX - r.lx) / dt) * 0.6;
  r.lx = t.clientX; r.lt = now;
}
function swipeMenuOn(d) {

const FIELDS = [['_t', 6, 'title'], ['_g', 5, 'guest'], ['_l', 4, 'topic'], ['_k', 3, 'subject'], ['_s', 2, 'show'], ['_p', 1.5, 'theme']];
function scoreItem(it, terms, phrase) {
  let total = 0, hit = 0, why = '';
  for (const t of terms) {
    let best = 0, bw = '';
    for (const [f, w, label] of FIELDS) {
      const v = ' ' + it[f];
      if (v.indexOf(' ' + t) >= 0 && w > best) { best = w; bw = label; }
    }
    if (best) { hit++; total += best; if (!why || best >= 4) why = bw; }
  }
  if (phrase && terms.length > 1 && (' ' + it._t).indexOf(' ' + phrase) >= 0) total += 8;
  return { total, hit, why };
}
let searchShown = 30, searchList = [], searchClose = false;

  let list = library();

  if (S.theme) list = list.filter(x => x.topics.includes(S.theme));
  const phrase = norm(S.q);
  const terms = phrase.split(' ').filter(t => t.length > 1 || /\d/.test(t));
  searchClose = false;
  if (!terms.length) { searchList = list.map(x => ({ it: x })); return; }
  let scored = list.map(it => Object.assign({ it }, scoreItem(it, terms, phrase)));
  let all = scored.filter(x => x.hit === terms.length);
  if (!all.length) { all = scored.filter(x => x.hit > 0); searchClose = all.length > 0; }
  all.sort((a, b) => b.total - a.total || (b.it.date || '').localeCompare(a.it.date || ''));
  const whyLabel = { title: '', guest: 'Guest match', topic: 'Topic match', subject: 'Subject match', show: '', theme: '' };
  searchList = all.map(x => ({ it: x.it, why: whyLabel[x.why] || '' }));
}

const TIME_RE = /\b(?:\d{1,2}:)?\d{1,2}:\d{2}\b/g;
function toSec(t) { return t.split(':').reduce((a, b) => a * 60 + Number(b), 0); }

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  const r = await fetch(CIRCLE_API + '/api/push/subscribe', { method: 'POST', headers: { Authorization: 'Bearer ' + S.token, 'Content-Type': 'application/json' }, body: JSON.stringify({ sub: sub.toJSON(), level: load('iva_level') || undefined }) });

  return Promise.resolve(ask).then(async perm => {
    if (perm !== 'granted') { toast('Notifications are off for InnerVerse. You can allow them in your phone settings.'); return false; }
    const reg = await navigator.serviceWorker.ready;
    const { key } = await fetch(CIRCLE_API + '/api/push/key').then(r => r.json());

    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlKey(key) });
    await sendSub(sub);

  }).catch(e => { toast('Could not turn on notifications. Please try again.'); return false; }).finally(() => renderPushBox());
}

    ms.setActionHandler('seekbackward', d => { aud.currentTime = Math.max(0, aud.currentTime - ((d && d.seekOffset) || 15)); });
    ms.setActionHandler('seekforward', d => { aud.currentTime = Math.min(aud.duration || 1e9, aud.currentTime + ((d && d.seekOffset) || 30)); });
    try { ms.setActionHandler('seekto', d => { if (d.seekTime != null) aud.currentTime = d.seekTime; }); } catch (e) {}
    try { ms.setActionHandler('previoustrack', () => jumpChapter(-1)); ms.setActionHandler('nexttrack', () => jumpChapter(1)); } catch (e) {}
  } catch (e) {}
}
function jumpChapter(dir) {
  if (cur && cur.kind === 's') { if (dir < 0 && aud.currentTime > 4) aud.currentTime = 0; else nextSong(dir); return; }
  if (!cur || !cur.chapters || !cur.chapters.length) { aud.currentTime += dir * 30; return; }
  const i = currentChapterIndex();
  if (dir < 0) { const c = cur.chapters[i]; if (c && aud.currentTime - c.seek > 4) aud.currentTime = c.seek; else if (i > 0) aud.currentTime = cur.chapters[i - 1].seek; else aud.currentTime = 0; }
  else if (i + 1 < cur.chapters.length) aud.currentTime = cur.chapters[i + 1].seek;
}

// now playing sheet
let npOpen = false;
function openNP() { if (!cur) return; npOpen = true; renderNP(); const n = $('#np'); n.classList.add('open'); n.setAttribute('aria-hidden', 'false'); }
function closeNP() { npOpen = false; const n = $('#np'); n.classList.remove('open'); n.setAttribute('aria-hidden', 'true'); }
// a song's player ends with the episode it came from: its thumbnail, title, show and date (Chance, 2026-10-26)
function npEpCard(s) {
  const ep = songEp(s);
  const title = ep ? ep.title : (s.episodeTitle || 'The episode');
  const meta = [ep && ep.kind === 'plus' ? 'Plus+ full episode' : ((ep && ep.shows && ep.shows[0]) || ''), fmtDate(songDate(s))].filter(Boolean).map(esc).join(' &middot; ');
  return `<button class="npep" id="npEp" aria-label="Open the episode: ${esc(title)}">
    <span class="nek">From the episode</span>
    <span class="ner">${ep && ep.thumb ? `<img src="${esc(img(ep.thumb, 300))}" alt="">` : ''}<span class="net"><b>${esc(title)}</b>${meta ? `<span>${meta}</span>` : ''}</span>${I.right(20)}</span>
  </button>`;
}
function renderNP() {
  const n = $('#np'); if (!cur) return;

  n.innerHTML = `<div class="grab"><button class="iconbtn" id="npClose" aria-label="Close the player">${I.down(28)}</button></div>
    <img class="art${cur.kind === 's' ? ' sq' : ''}" src="${esc(img(cur.thumb, 750))}" alt="">
    <div class="npbody">
      ${song ? `<div class="nk">InnerVerse Music</div>` : ''}<div class="nt">${esc(cur.title)}</div>${song ? '' : `<div class="nc" id="npC">${esc(currentChapterTitle())}</div>`}
      <input type="range" id="npR" min="0" max="${Math.max(1, Math.floor(d))}" step="1" value="${Math.floor(aud.currentTime)}" aria-label="Position">
      <div class="times"><span id="npT">${clock(aud.currentTime)}</span><span id="npD">-${clock(Math.max(0, d - aud.currentTime))}</span></div>
      <div class="ctl">
        <button class="sk" id="npPrev" aria-label="${cur.kind === 's' ? 'Previous song' : 'Previous chapter'}">${I.prev(24)}</button>
        <button class="sk" id="npBack" aria-label="Back 15 seconds">${I.rew(34)}<small>15</small></button>
        <button class="big" id="npPP" aria-label="${aud.paused ? 'Play' : 'Pause'}">${aud.paused ? I.play(36) : I.pause(36)}</button>
        <button class="sk" id="npFwd" aria-label="Forward 30 seconds">${I.fwd(34)}<small>30</small></button>
        <button class="sk" id="npNext" aria-label="${cur.kind === 's' ? 'Next song' : 'Next chapter'}">${I.next(24)}</button>
      </div>
      <div class="opts">${song ? `<button type="button" class="shufpill" data-shuf-toggle aria-pressed="${shuffleOn}">${I.shuffle(16)} Shuffle</button>` + songActs(song, 18).replace(/class="sact"/g, 'class="sact pill"') : `<button id="npSpeed">${speed}x speed</button><button id="npEp">Episode page</button>`}</div>
      ${song ? npEpCard(song) : ''}
    </div>
    ${cur.chapters && cur.chapters.length ? `<div class="chlist"><div class="eyebrow" style="margin:6px 8px 6px">Chapters</div><div id="npChaps">${cur.chapters.map((c, i) => `<button class="chap" data-i="${i}"><span class="tm">${clock(c.seek)}</span><span class="ct">${esc(c.title)}</span></button>`).join('')}</div></div>` : ''}`;
  $('#npClose').addEventListener('click', closeNP);
  $('#npPP').addEventListener('click', togglePlay);
  $('#npBack').addEventListener('click', () => { aud.currentTime = Math.max(0, aud.currentTime - 15); });
  $('#npFwd').addEventListener('click', () => { aud.currentTime = Math.min(aud.duration || 1e9, aud.currentTime + 30); });
  $('#npPrev').addEventListener('click', () => jumpChapter(-1));
  $('#npNext').addEventListener('click', () => jumpChapter(1));
  if ($('#npSpeed')) $('#npSpeed').addEventListener('click', e => { const s = [1, 1.25, 1.5, 1.75, 2, 0.8]; speed = s[(s.indexOf(speed) + 1) % s.length]; aud.playbackRate = speed; store('iva_speed', String(speed)); e.target.textContent = speed + 'x speed'; });
  $('#npEp').addEventListener('click', () => { closeNP(); const ep = song && songEp(song); go(ep ? epHref(ep) : '#/' + (cur.kind === 'p' ? 'p' : 'e') + '/' + cur.slug); });
  const r = $('#npR'); let drag = false;
  r.addEventListener('input', () => { drag = true; $('#npT').textContent = clock(r.value); });
  r.addEventListener('change', () => { aud.currentTime = Number(r.value); drag = false; });
  r._drag = () => drag;
  const nc = $('#npChaps'); if (nc) nc.addEventListener('click', e => { const b = e.target.closest('.chap'); if (!b) return; aud.currentTime = cur.chapters[+b.dataset.i].seek; if (aud.paused) togglePlay(); });
  updateNP(); updateSongUI();
}
function updateNP() {
  const r = $('#npR'); if (!r || !cur) return;
  const d = aud.duration || cur.dur || 0;
  if (r.max != Math.floor(d) && d) r.max = Math.floor(d);
  if (!(r._drag && r._drag())) { r.value = Math.floor(aud.currentTime); $('#npT').textContent = clock(aud.currentTime); }
  $('#npD').textContent = '-' + clock(Math.max(0, d - aud.currentTime));
  if ($('#npC')) $('#npC').textContent = currentChapterTitle();
  const i = currentChapterIndex();
  $$('#npChaps .chap').forEach((c, k) => c.classList.toggle('now', k === i));
}
// swipe down to close the player
(function () { const n = $('#np'); let y0 = null; n.addEventListener('touchstart', e => { if (n.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true }); n.addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeNP(); y0 = null; }, { passive: true }); })();

try { if (/[?&]browser=1\b/.test(location.search)) sessionStorage.setItem('iva_browser', '1'); } catch (e) {}
const gated = !standalone && (() => { try { return sessionStorage.getItem('iva_browser') !== '1'; } catch (e) { return true; } })();

// ------------------------------------------------------------ fill the whole screen
// On some iPhones a home-screen app's page stops short of the bottom of the screen (by about the status bar's height),
// leaving a blank strip under fixed bars. Measure it and let the bars and pages reach the real bottom.
function insets() {
  try { const cs = getComputedStyle($('#saprobe')); return { top: Math.round(parseFloat(cs.paddingTop) || 0), bottom: Math.round(parseFloat(cs.paddingBottom) || 0) }; } catch (e) { return { top: 0, bottom: 0 }; }
}
function measureGap() {
  try {
    if (window.visualViewport && window.visualViewport.height < window.innerHeight - 120) return; // keyboard open
    let gap = 0;
    if (standalone && isIOS) {
      const portrait = window.innerHeight > window.innerWidth;
      const sh = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
      const short = Math.round(sh - window.innerHeight);
      const top = insets().top;
      if (short > 0) gap = top > 0 ? Math.min(short, top) : (short <= 70 ? short : 0);
    }
    window.__ivaGap = gap;
  } catch (e) {}
}
function screenReport() {
  const i = insets();
  return 'screen ' + screen.height + ' · window ' + window.innerHeight + ' · top ' + i.top + ' · bottom ' + i.bottom + ' · gap ' + (window.__ivaGap || 0);
}
measureGap();
window.addEventListener('resize', measureGap);
window.addEventListener('orientationchange', () => setTimeout(measureGap, 300));

// ------------------------------------------------------------ no zooming: the layout is made to fit
function noZoom(doc) {
  const stop = e => { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => doc.addEventListener(t, stop, { passive: false }));
  doc.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
}
noZoom(document);

loadLibrary().then(async () => {
  await loadMyLib();
  renderHome(); renderSearch(); renderLib(); route();
  setTimeout(() => { if (S.member) { mountChat(); } }, 1500);
}).catch(() => {
  $('#home').innerHTML = `<header class="hdr"><div class="row">${headerBrand()}</div></header><div class="wrap"><div class="empty">The episodes could not load. Check your connection and pull this screen down or reopen the app.<br><br><button class="btn line" onclick="location.reload()">Try again</button></div></div>`;
});
checkStatus();
loadPromo();
if (handoffPending()) { showHandoffBar(); pollHandoff(); }
function checkUpdate() {
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = (v || '').trim();
    if (v && v !== VERSION && !(cur && !aud.paused) && !videoOwns) location.reload();
  }).catch(() => {});
}
setTimeout(checkUpdate, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkStatus(); checkUpdate(); } else if (cur && aud.currentTime) saveProg(cur.key, aud.currentTime, aud.duration || cur.dur); });
if (gated) showGate(); else setTimeout(() => showInstall(false), 2500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
